        /**
         * PdfViewer - Renders a single PDF using PDF.js onto a series of canvases.
         * Supports all pages on all platforms including iOS Safari.
         *
         * @param {Object} props
         * @param {string} props.url - Object URL of the PDF blob
         */
        const PdfViewer = ({ url }) => {
            const [pages, setPages] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);
            const renderRefs = useRef([]);
            const renderTasks = useRef([]);

            useEffect(() => {
                if (!url) return;

                setIsLoading(true);
                setLoadError(null);
                setPages([]);
                renderRefs.current = [];
                // Cancel any outstanding render tasks from previous document
                renderTasks.current.forEach((task) => { try { task.cancel(); } catch (_) {} });
                renderTasks.current = [];

                const lib = window.pdfjsLib;
                if (!lib) {
                    setLoadError('PDF.js failed to load. Please refresh the page.');
                    setIsLoading(false);
                    return;
                }

                // Configure worker lazily (only once)
                if (!lib.GlobalWorkerOptions.workerSrc) {
                    lib.GlobalWorkerOptions.workerSrc =
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                }

                lib.getDocument(url).promise
                    .then((pdfDoc) => {
                        const pageNumbers = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
                        setPages(pageNumbers);
                        setIsLoading(false);

                        // Render each page after the canvases are mounted
                        // Use a small delay to let React commit the canvas elements
                        setTimeout(() => {
                            pageNumbers.forEach((pageNum, idx) => {
                                pdfDoc.getPage(pageNum).then((page) => {
                                    const canvas = renderRefs.current[idx];
                                    if (!canvas) return;

                                    const containerWidth = canvas.parentElement
                                        ? canvas.parentElement.clientWidth || 800
                                        : 800;
                                    const devicePixelRatio = window.devicePixelRatio || 1;
                                    const baseViewport = page.getViewport({ scale: 1 });
                                    const cssScale = containerWidth / baseViewport.width;
                                    const renderScale = cssScale * devicePixelRatio;
                                    const viewport = page.getViewport({ scale: renderScale });

                                    // Physical canvas size matches device pixels for sharp rendering
                                    canvas.width = viewport.width;
                                    canvas.height = viewport.height;
                                    // CSS size stays at logical pixels so layout is unchanged
                                    canvas.style.width = `${viewport.width / devicePixelRatio}px`;
                                    canvas.style.height = `${viewport.height / devicePixelRatio}px`;

                                    const task = page.render({
                                        canvasContext: canvas.getContext('2d'),
                                        viewport
                                    });
                                    renderTasks.current[idx] = task;
                                    task.promise.catch(() => {});
                                });
                            });
                        }, 50);
                    })
                    .catch((err) => {
                        setLoadError('Could not load PDF: ' + (err.message || 'unknown error'));
                        setIsLoading(false);
                    });
            }, [url]);

            if (isLoading) {
                return h('div', { className: "flex items-center justify-center h-64 text-gray-400 font-bold text-sm" }, 'Loading PDF…');
            }
            if (loadError) {
                return h('div', { className: "flex items-center justify-center h-32 text-red-500 font-bold text-sm p-4 text-center" }, loadError);
            }

            return h('div', { className: "flex flex-col gap-2" },
                pages.map((pageNum, idx) =>
                    h('canvas', {
                        key: pageNum,
                        ref: (el) => { renderRefs.current[idx] = el; },
                        className: "w-full rounded-xl shadow-sm bg-white"
                    })
                )
            );
        };

        /**
         * DocumentViewer - Renders a single document based on its file type.
         * Supports PDF, text, and common image formats.
         *
         * @param {Object} props
         * @param {{name: string, extension: string, url: string, textContent: string|null}} props.documentItem
         */
        const DocumentViewer = ({ documentItem }) => {
            if (!documentItem) {
                return h('div', { className: "flex items-center justify-center h-32 text-gray-400 font-bold text-sm" }, 'No document selected.');
            }

            if (documentItem.extension === 'pdf') {
                return h(PdfViewer, { url: documentItem.url });
            }

            if (documentItem.extension === 'txt') {
                return h('pre', {
                    className: "whitespace-pre-wrap break-words text-xs sm:text-sm leading-relaxed text-gray-700 bg-gray-50 rounded-2xl p-4 overflow-x-auto font-mono"
                }, documentItem.textContent || 'This text file is empty.');
            }

            if (isImageDocument(documentItem.extension)) {
                return h('div', { className: "bg-gray-50 rounded-2xl p-2 sm:p-4" },
                    h('img', {
                        src: documentItem.url,
                        alt: documentItem.name,
                        className: "w-full h-auto rounded-xl mx-auto"
                    })
                );
            }

            return h('div', { className: "text-center py-10 text-gray-500" },
                h('p', { className: "font-bold mb-2" }, 'Preview not available for this file type.'),
                h('a', {
                    href: documentItem.url,
                    target: '_blank',
                    rel: 'noreferrer',
                    className: "inline-flex items-center px-4 py-2 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition"
                }, 'Open File')
            );
        };

        /**
         * DocumentsPage - Displays documents extracted from documents.backup.
         * Renders a selectable list and a type-aware viewer.
         *
         * @param {Object} props - Component properties
         * @param {Array<{name: string, extension: string, url: string, textContent: string|null}>} props.documents - Extracted documents
         * @param {number} props.selectedDocumentIndex - Currently selected document index
         * @param {Function} props.onSelectDocument - Callback to switch selected document
         */
        const DocumentsPage = ({ documents, selectedDocumentIndex, onSelectDocument }) => {
            const [isListExpanded, setIsListExpanded] = useState(false);

            if (!documents || documents.length === 0) {
                return h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm text-center text-gray-500" },
                    h('h3', { className: "text-lg font-bold mb-2" }, "Documents"),
                    h('p', null, "No files from documents.backup were found in this archive.")
                );
            }

            const safeIndex = Math.min(Math.max(selectedDocumentIndex || 0, 0), documents.length - 1);
            const activeDocument = documents[safeIndex];
            
            // Group documents by file type and sort by name within groups
            const groupedDocuments = documents.reduce((acc, doc, index) => {
                const extension = doc.extension || 'other';
                if (!acc[extension]) {
                    acc[extension] = [];
                }
                acc[extension].push({ doc, index });
                return acc;
            }, {});

            // Sort groups by extension name, and sort documents within each group by name
            const sortedGroups = Object.entries(groupedDocuments)
                .sort(([extA], [extB]) => extA.localeCompare(extB))
                .map(([ext, items]) => [ext, items.sort((a, b) => a.doc.name.localeCompare(b.doc.name))]);

            // Create a flat array of sorted indices for navigation
            const sortedIndices = sortedGroups.flatMap(([_, items]) => items.map(({ index }) => index));

            // Find current position in the sorted order
            const currentSortedPosition = sortedIndices.indexOf(safeIndex);
            const isFirstInSortedOrder = currentSortedPosition === 0;
            const isLastInSortedOrder = currentSortedPosition === sortedIndices.length - 1;

            const handleSelectDocument = (targetIndex) => {
                const clampedIndex = Math.min(Math.max(targetIndex, 0), documents.length - 1);
                if (clampedIndex === safeIndex) return;
                onSelectDocument(clampedIndex);
            };

            const handleNavigateNext = () => {
                if (currentSortedPosition < sortedIndices.length - 1) {
                    onSelectDocument(sortedIndices[currentSortedPosition + 1]);
                }
            };

            const handleNavigatePrev = () => {
                if (currentSortedPosition > 0) {
                    onSelectDocument(sortedIndices[currentSortedPosition - 1]);
                }
            };



            return h('div', { className: "space-y-4" },
                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('button', {
                        type: 'button',
                        onClick: () => setIsListExpanded(!isListExpanded),
                        className: "w-full flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg transition"
                    },
                        h('h3', { className: "text-sm font-bold text-gray-800" }, `All Documents (${documents.length})`),
                        h('span', { className: `text-gray-400 text-lg transition-transform ${isListExpanded ? 'rotate-180' : ''}` }, '▼')
                    ),
                    isListExpanded && h('div', { className: "mt-3 pt-3 border-t border-gray-100 space-y-4" },
                        sortedGroups.map(([extension, items]) =>
                            h('div', { key: extension },
                                h('h4', { className: "text-xs uppercase font-bold text-gray-400 tracking-wider mb-2" }, extension.toUpperCase()),
                                h('div', { className: "flex flex-wrap gap-2" },
                                    items.map(({ doc, index }) =>
                                        h('button', {
                                            key: `${doc.name}-${index}`,
                                            type: 'button',
                                            onClick: () => handleSelectDocument(index),
                                            className: `px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${index === safeIndex ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`,
                                            title: doc.name
                                        }, doc.name)
                                    )
                                )
                            )
                        )
                    )
                ),
                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-sm sm:text-base font-bold text-gray-800 mb-4 break-words" }, activeDocument.name),
                    h('div', { className: "flex items-center gap-2 mb-4" },
                        h('button', {
                            type: 'button',
                            onClick: handleNavigatePrev,
                            disabled: isFirstInSortedOrder,
                            className: `h-12 w-12 sm:h-9 sm:w-9 rounded-full text-xl sm:text-lg font-black transition ${isFirstInSortedOrder ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                            title: 'Previous document',
                            'aria-label': 'Previous document'
                        }, '←'),
                        h('button', {
                            type: 'button',
                            onClick: handleNavigateNext,
                            disabled: isLastInSortedOrder,
                            className: `h-12 w-12 sm:h-9 sm:w-9 rounded-full text-xl sm:text-lg font-black transition ${isLastInSortedOrder ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                            title: 'Next document',
                            'aria-label': 'Next document'
                        }, '→'),
                        h('a', {
                            href: activeDocument.url,
                            download: activeDocument.name,
                            className: "h-9 px-3 rounded-full text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition inline-flex items-center",
                            title: 'Download document',
                            'aria-label': 'Download document'
                        }, 'Download')
                    ),
                    h(DocumentViewer, { documentItem: activeDocument })
                )
            );
        };

        // ==========================================
        // COLUMN CONFIGURATION
        // ==========================================

        /**
         * Static column definitions for additional flight data display.
         * Each column specifies a data path, human-readable label, and default visibility.
         * These can be toggled on/off in the settings panel.
         */
        const STATIC_COLUMNS = [
            { path: 'averages.altitude', label: 'Altitude (Avg)', defaultVisible: false },
            { path: 'averages.groundSpeed', label: 'Ground Speed (Avg)', defaultVisible: false },
            { path: 'averages.isaDeviation', label: 'ISA Deviation', defaultVisible: false },
            { path: 'indicatedAirSpeed.value', label: 'Indicated Air Speed', defaultVisible: false },
            { path: 'tracks.outbound.magnetic', label: 'Track Outbound (Magnetic)', defaultVisible: false },
            { path: 'tracks.outbound.true', label: 'Track Outbound (True)', defaultVisible: false },
            { path: 'tracks.segment.magnetic', label: 'Track Segment (Magnetic)', defaultVisible: false },
            { path: 'tracks.segment.true', label: 'Track Segment (True)', defaultVisible: false },
            { path: 'tropopause.value', label: 'Tropopause', defaultVisible: false },
            { path: 'temperature.value', label: 'Temperature', defaultVisible: false },
            { path: 'windComponent.value', label: 'Wind Component', defaultVisible: false },
            { path: 'windShear.value', label: 'Wind Shear', defaultVisible: false },
            { path: 'coordinates', label: 'Coordinates', defaultVisible: false },
            { path: 'averages.machSpeed', label: 'Mach Speed (Avg)', defaultVisible: false },
            { path: 'averages.minimumSafeAltitude.value', label: 'Min Safe Altitude', defaultVisible: false },
            { path: 'groundDistance.value', label: 'Ground Distance', defaultVisible: false },
            { path: 'averages.trueAirSpeed', label: 'True Air Speed (Avg)', defaultVisible: false }
        ];

        /**
         * Gets the human-readable label for a column path.
         * Falls back to a formatted version of the path if no label is found.
         * @param {string} path - The column data path
         * @returns {string} Human-readable column label
         */
        const getColumnLabel = (path) => {
            const columnDefinition = STATIC_COLUMNS.find(col => col.path === path);
            return columnDefinition ? columnDefinition.label : path.split('.').pop();
        };

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================

        /**
         * Main App Component - Root component managing the flight log application state.
         * Handles file uploads, route data management, and UI state for settings panel.
         */
        const App = () => {
            // Application state
            const [routeData, setRouteData] = useState(null);
            const [flightSummaryData, setFlightSummaryData] = useState(null);
            const [crewMembersData, setCrewMembersData] = useState(null);
            const [errorMessage, setErrorMessage] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [selectedColumns, setSelectedColumns] = useState([]);
            const [selectedPage, setSelectedPage] = useState('summary');
            const [documents, setDocuments] = useState([]);
            const [selectedDocumentIndex, setSelectedDocumentIndex] = useState(0);

            useEffect(() => {
                return () => {
                    documents.forEach((documentItem) => {
                        if (documentItem?.url) {
                            URL.revokeObjectURL(documentItem.url);
                        }
                    });
                };
            }, [documents]);

            /**
             * Handles file upload and processing.
             * Reads the uploaded file, processes the flight data, and updates application state.
             * @param {Event} event - File input change event
             */
            const handleFileUpload = async (event) => {
                const selectedFile = event.target.files[0];
                if (!selectedFile) return;

                try {
                    const { routesBackupText, flightBackupText, crewMembersBackupText, documentFiles } = await readBackupFilesFromArchive(selectedFile);
                    const processedRoute = processFlightData(routesBackupText);
                    const processedSummary = processFlightSummaryData(flightBackupText);
                    const processedCrew = crewMembersBackupText ? JSON.parse(crewMembersBackupText) : null;
                    const mappedDocuments = documentFiles.map((documentItem) => ({
                        name: documentItem.name,
                        extension: documentItem.extension,
                        textContent: documentItem.textContent,
                        url: URL.createObjectURL(documentItem.blob)
                    }));

                    setRouteData(processedRoute);
                    setFlightSummaryData(processedSummary);
                    setCrewMembersData(Array.isArray(processedCrew) ? processedCrew : null);
                    setDocuments(mappedDocuments);
                    setSelectedDocumentIndex(0);
                    setSelectedPage('summary');
                    setErrorMessage(null);
                } catch (processingError) {
                    setErrorMessage("Error loading file: " + processingError.message);
                }

                // Reset file input
                event.target.value = '';
            };

            /**
             * Toggles visibility of a column in the waypoint display.
             * @param {string} columnPath - The path of the column to toggle
             */
            const toggleColumnVisibility = (columnPath) => {
                setSelectedColumns(prevSelected =>
                    prevSelected.includes(columnPath)
                        ? prevSelected.filter(path => path !== columnPath)
                        : [...prevSelected, columnPath]
                );
            };

            // Show welcome screen if no route data is loaded
            if (!routeData) {
                return h(WelcomeScreen, {
                    onFileSelected: handleFileUpload,
                    error: errorMessage
                });
            }

            // Main application interface
            return h('div', { className: "max-w-6xl mx-auto p-3 sm:p-6 animate-in" },

                // Subpage menu (Overview / OFP) + Settings button
                h('div', { className: "flex items-center gap-3 mb-4 sm:mb-6" },
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'summary' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => {
                            setSelectedPage('summary');
                            setShowSettings(false);
                        }
                    }, 'Overview'),
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'OFP' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => setSelectedPage('OFP')
                    }, 'OFP'),
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'documents' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => {
                            setSelectedPage('documents');
                            setShowSettings(false);
                        }
                    }, 'Documents'),
                    h('div', { className: "relative ml-auto" },
                        h('button', {
                            onClick: () => setShowSettings(!showSettings),
                            className: "text-gray-400 hover:text-gray-600 font-bold text-sm bg-white border border-gray-200 hover:border-gray-300 p-2 rounded-lg transition-colors shadow-sm",
                            'aria-label': 'Toggle column settings',
                            title: 'Column settings'
                        }, h(Icon, { name: "settings", className: "w-4 h-4" })),
                        showSettings && h('div', {
                            className: "absolute top-11 right-0 z-20 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 w-[min(92vw,440px)] animate-in"
                        },
                            // Overview section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Overview"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "No settings"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Documents"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "Select documents directly on the Documents tab"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            // OFP section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-3" }, "OFP Columns"),
                            h('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3" },
                                STATIC_COLUMNS
                                    .slice()
                                    .sort((a, b) => a.label.localeCompare(b.label))
                                    .map(column => h('label', {
                                        key: column.path,
                                        className: "flex items-center gap-2.5 cursor-pointer group"
                                    },
                                        h('input', {
                                            type: 'checkbox',
                                            className: "w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500",
                                            checked: selectedColumns.includes(column.path),
                                            onChange: () => toggleColumnVisibility(column.path)
                                        }),
                                        h('span', { className: "text-sm font-bold text-gray-500 group-hover:text-gray-800" }, column.label)
                                    ))
                            ),

                            h('div', { className: "border-t border-gray-100 mt-1 mb-3" }),

                            // Close settings action
                            h('button', {
                                onClick: () => setShowSettings(false),
                                className: "w-full text-left text-sm font-bold text-gray-600 hover:text-gray-800 hover:bg-gray-50 px-3 py-2 rounded-lg transition-colors mb-1"
                            }, "Close Settings"),

                            // Close flight action
                            h('button', {
                                onClick: () => {
                                    setShowSettings(false);
                                    setRouteData(null);
                                    setFlightSummaryData(null);
                                    setCrewMembersData(null);
                                    setDocuments([]);
                                    setSelectedDocumentIndex(0);
                                },
                                className: "w-full text-left text-sm font-bold text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors"
                            }, "Close Flight")
                        )
                    )
                ),

                // Route header is shown only on Overview page
                selectedPage === 'summary' && h(RouteHeader, {
                    route: routeData,
                    atcCallsign: flightSummaryData?.atcCallsign || null,
                    flightNumber: flightSummaryData?.flightNumber || null,
                    originIcao: flightSummaryData?.originAirport?.icaoCode || null,
                    destinationIcao: flightSummaryData?.destinationAirport?.icaoCode || null,
                    ofpVersion: flightSummaryData?.ofpVersion || null,
                    scheduledTimes: flightSummaryData?.scheduledTimes || null
                }),

                // Page content (Summary, OFP, or Documents)
                selectedPage === 'OFP'
                    ? h('div', { className: "space-y-4" },
                        h(OffBlockSection, {
                            summary: flightSummaryData
                        }),
                        h('div', { className: "rounded-[2rem] border border-sky-100 bg-gradient-to-br from-sky-50 via-cyan-50 to-white p-3 sm:p-5 shadow-sm space-y-3" },
                            h('div', { className: "px-1" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-[0.22em] text-sky-600 mb-1" }, 'DEPARTURE')
                            ),
                            h('div', { className: "space-y-4" },
                                (routeData.waypoints || []).map((waypoint, index) =>
                                    h(WaypointCard, {
                                        key: waypoint.UUID || index,
                                        waypoint: waypoint,
                                        index: index,
                                        selectedColumns: selectedColumns
                                    })
                                )
                            )
                        )
                    )
                    : selectedPage === 'documents'
                        ? h(DocumentsPage, {
                            documents,
                            selectedDocumentIndex,
                            onSelectDocument: setSelectedDocumentIndex
                        })
                        : h(FlightSummaryPage, { summary: flightSummaryData, crewMembers: crewMembersData })
            );
        };

        // ==========================================
        // APPLICATION INITIALIZATION
        // ==========================================

        // Create React root and render the main App component
        // This initializes the FlightLog Pro application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>

</html>
