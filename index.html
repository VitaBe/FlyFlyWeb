<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightLog Pro - Stable Edition</title>
    <!-- React Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
        crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F5F7;
            font-family: -apple-system, system-ui, sans-serif;
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Prevent 300ms tap delay on mobile */
        button, input, label {
            touch-action: manipulation;
        }

        /* Ensure minimum touch target size */
        button {
            min-height: 28px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        // Extract required hooks and functions from the global React object
        const { useState, useEffect, createElement: h } = React;

        // ==========================================
        // CONSTANTS & CONFIGURATION
        // ==========================================

        // UI Style constants for consistent styling across components
        const UI_STYLES = {
            header: "text-[10px] uppercase font-bold text-gray-400 tracking-wider mb-1",
            label: "text-[10px] uppercase font-bold text-gray-400 tracking-wider",
            value: "text-[10px] font-bold text-gray-700",
            rowHeight: "h-7 flex items-center",
            input: "w-full bg-gray-50 border-none rounded px-2 py-0.5 font-bold text-[9px] text-blue-600 placeholder:text-gray-300 focus:ring-1 focus:ring-blue-100 outline-none h-7",
            button: "px-1.5 py-0.5 bg-gray-50 hover:bg-gray-100 rounded text-gray-400 hover:text-gray-600 text-[8px] font-bold leading-none transition-colors"
        };

        // Fuel increment/decrement step size
        const FUEL_STEP = 100;

        // ==========================================
        // UTILITY & FORMATTING FUNCTIONS
        // ==========================================

        /**
         * Formats an ISO date string into a localized time string (HH:MMZ).
         * Used for displaying planned and actual waypoint times.
         * @param {string} isoString - The ISO date string to format.
         * @returns {string} Formatted time string or "-" if invalid.
         */
        const formatTime = (isoString) => {
            if (!isoString) return "-";
            const date = new Date(isoString);
            return isNaN(date) ? "-" : date.toLocaleTimeString([], {
                timeZone: 'UTC',
                hour: '2-digit',
                minute: '2-digit'
            }) + 'Z';
        };

        /**
         * Formats fuel data into a readable string and raw numbers for calculation.
         * Handles both remaining and cumulative fuel values with units.
         * @param {Object} fuel - The fuel object from the waypoint data.
         * @returns {Object|null} Formatted fuel data with display strings and raw numbers.
         */
        const formatFuel = (fuel) => {
            if (!fuel) return null;

            const formatFuelValue = (value, unit) => {
                if (value === undefined) return null;
                return `${value} ${unit || ''}`.trim();
            };

            return {
                remaining: formatFuelValue(fuel.remaining, fuel.unit),
                cumulated: formatFuelValue(fuel.cumulated, fuel.unit),
                numRemaining: fuel.remaining,
                numCumulated: fuel.cumulated
            };
        };

        /**
         * Converts a time string (HH:MMZ) to total minutes since midnight.
         * Used for calculating time differences between planned and actual times.
         * @param {string} timeString - Time string in HH:MMZ format.
         * @returns {number|null} Total minutes or null if invalid.
         */
        const timeToMinutes = (timeString) => {
            if (!timeString || timeString === "-") return null;
            const timePart = timeString.split('Z')[0];
            const [hours, minutes] = timePart.split(':').map(Number);
            return isNaN(hours) || isNaN(minutes) ? null : hours * 60 + minutes;
        };

        /**
         * Formats a numeric difference with a plus/minus sign and optional unit.
         * Used for displaying deviations from planned values.
         * @param {number|null} difference - The numeric difference to format.
         * @param {string} unit - Optional unit string (e.g., "min", "kg").
         * @returns {string} Formatted difference string.
         */
        const formatDiff = (difference, unit = "") => {
            if (difference === null || difference === undefined || isNaN(difference)) return "-";
            const sign = difference > 0 ? "+" : (difference < 0 ? "" : "");
            const formattedValue = `${sign}${difference}`;
            return unit ? `${formattedValue} ${unit}` : formattedValue;
        };

        /**
         * Extracts track value from nested tracks array structure.
         * Handles complex paths like "tracks.segment.true" or "tracks.outbound.magnetic".
         * @param {Object} waypoint - The waypoint object containing tracks data.
         * @param {string} path - The field path (e.g., "tracks.segment.true").
         * @returns {Object|null} The track value object with {value, unit} or null.
         */
        const extractTrackValue = (waypoint, path) => {
            if (!waypoint || !path.startsWith('tracks.')) return null;

            const parts = path.split('.');
            if (parts.length !== 3) return null;

            const [tracksKey, segmentKey, typeKey] = parts;
            const tracksObj = waypoint.tracks;

            if (!tracksObj || !tracksObj[segmentKey] || !Array.isArray(tracksObj[segmentKey])) {
                return null;
            }

            const trackArray = tracksObj[segmentKey];
            const trackObj = trackArray.find(track => track.type === typeKey);

            return trackObj || null;
        };

        /**
         * Formats a numeric value with thousand separators for better readability.
         * @param {number|string} value - The number to format.
         * @returns {string} Formatted number string.
         */
        const formatNumber = (value) => {
            if (value === null || value === undefined || value === "") return "-";
            const number = Number(value);
            if (isNaN(number)) return String(value);
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 9 }).format(number);
        };

        /**
         * Normalizes unit strings to human-friendly display format.
         * Converts abbreviations to proper symbols (e.g., "deg" to "°").
         * @param {string} unit - The unit string to normalize.
         * @param {string} value - The value to combine with the unit.
         * @returns {string} Formatted value with normalized unit.
         */
        const formatUnit = (unit, value) => {
            if (!unit) return value;
            const normalizedUnit = String(unit).trim().toLowerCase();

            const unitMappings = {
                'deg': '°',
                'degree': '°',
                '°': '°'
            };

            const displayUnit = unitMappings[normalizedUnit] || unit;
            return `${value}${displayUnit}`;
        };

        /**
         * Formats any waypoint property value, handling various data types.
         * Supports nested objects, arrays, numbers, strings, and special value/unit objects.
         * @param {*} value - The value to format.
         * @returns {string} Formatted display string.
         */
        const formatWaypointValue = (value) => {
            if (value === null || value === undefined || value === '') return '-';

            if (Array.isArray(value)) {
                if (value.length === 0) return '-';
                const formattedItems = value.map(formatWaypointValue).filter(item => item && item !== '-');
                return formattedItems.length > 0 ? formattedItems.join(', ') : '-';
            }

            if (typeof value === 'object') {
                // Handle value/unit objects (e.g., {value: 123, unit: "kg"})
                if (value.value !== undefined) {
                    const formattedValue = formatNumber(value.value);
                    return formatUnit(value.unit || value.units, formattedValue);
                }

                // Handle plain objects by flattening to key-value pairs
                const validEntries = Object.entries(value).filter(([key, val]) =>
                    val !== null && val !== undefined && val !== ''
                );

                if (validEntries.length === 0) return '-';
                if (validEntries.length === 1) {
                    return formatWaypointValue(validEntries[0][1]);
                }

                return validEntries.map(([key, val]) =>
                    `${key}: ${formatWaypointValue(val)}`
                ).join(', ');
            }

            if (typeof value === 'number') {
                return formatNumber(value);
            }

            if (typeof value === 'string') {
                // Try to parse as number if it looks numeric
                const numericValue = Number(value);
                if (!isNaN(numericValue) && value.trim().length > 0) {
                    return formatNumber(numericValue);
                }
                return value;
            }

            return String(value);
        };

        /**
         * Retrieves a nested value from an object using dot notation.
         * Handles special cases like coordinates and track values.
         * @param {Object} object - The object to extract value from.
         * @param {string} path - Dot-separated path to the value.
         * @returns {string} Formatted value string.
         */
        const getNestedValue = (object, path) => {
            let rawValue;

            if (path === 'coordinates') {
                // Special handling: combine latitude and longitude
                const latitude = object.latitude;
                const longitude = object.longitude;
                if (latitude !== undefined && longitude !== undefined) {
                    return `${formatWaypointValue(latitude)}, ${formatWaypointValue(longitude)}`;
                }
                return '-';
            } else if (path.startsWith('tracks.')) {
                // Special handling for track values
                rawValue = extractTrackValue(object, path);
            } else {
                // Standard nested property access
                rawValue = path.split('.').reduce((obj, key) =>
                    (obj ? obj[key] : undefined), object
                );
            }

            return formatWaypointValue(rawValue);
        };

        // ==========================================
        // BUSINESS LOGIC & DATA PROCESSING
        // ==========================================

        /**
         * Processes raw JSON flight data and extracts the main route information.
         * Parses the uploaded file content, validates the structure, and prepares
         * waypoint data for display by sorting them chronologically.
         *
         * @param {string} jsonText - The raw JSON string from the uploaded file.
         * @returns {Object} The processed main route data with sorted waypoints.
         * @throws {Error} If the JSON is invalid or missing required route structure.
         */
        const processFlightData = (jsonText) => {
            const parsedData = JSON.parse(jsonText);
            const routes = Array.isArray(parsedData) ? parsedData : [parsedData];

            if (routes.length === 0) {
                throw new Error("The file does not contain any routes.");
            }

            // Select the primary route (prefer ID 0) or fallback to first available
            const mainRoute = routes.find(route => route.id === 0) || routes[0];

            // Ensure waypoints exist and sort them by sequence for logical flight path
            if (mainRoute && Array.isArray(mainRoute.waypoints)) {
                mainRoute.waypoints.sort((waypointA, waypointB) =>
                    (waypointA.sequenceId || 0) - (waypointB.sequenceId || 0)
                );
            } else {
                // Provide fallback empty array to prevent rendering errors
                mainRoute.waypoints = [];
            }

            return mainRoute;
        };

        /**
         * Extracts routes.backup and flight.backup JSON payloads from a ZIP-compatible archive.
         * @param {File} uploadedFile - User-selected archive file.
         * @returns {Promise<{routesBackupText: string, flightBackupText: string|null, pdfFiles: Array<{name: string, blob: Blob}>}>}
         * @throws {Error} If archive cannot be read or routes.backup is missing.
         */
        const readBackupFilesFromArchive = async (uploadedFile) => {
            if (!window.JSZip) {
                throw new Error("ZIP library failed to load. Please refresh and try again.");
            }

            let zipArchive;
            try {
                const archiveBuffer = await uploadedFile.arrayBuffer();
                zipArchive = await JSZip.loadAsync(archiveBuffer);
            } catch (archiveError) {
                throw new Error("Invalid archive file. Please upload a ZIP/.effarchive export.");
            }

            const routesEntry = zipArchive.file('routes.backup');
            if (!routesEntry) {
                throw new Error("The archive does not contain routes.backup.");
            }

            const flightEntry = zipArchive.file('flight.backup');
            const pdfEntries = Object.values(zipArchive.files)
                .filter((archiveEntry) => !archiveEntry.dir && /\.pdf$/i.test(archiveEntry.name));

            const [routesBackupText, flightBackupText, pdfBlobs] = await Promise.all([
                routesEntry.async('string'),
                flightEntry ? flightEntry.async('string') : Promise.resolve(null),
                Promise.all(pdfEntries.map((pdfEntry) => pdfEntry.async('blob')))
            ]);

            const pdfFiles = pdfEntries.map((pdfEntry, index) => {
                const originalBlob = pdfBlobs[index];
                const pdfBlob = originalBlob.type === 'application/pdf'
                    ? originalBlob
                    : new Blob([originalBlob], { type: 'application/pdf' });

                return {
                    name: pdfEntry.name,
                    blob: pdfBlob
                };
            });

            return { routesBackupText, flightBackupText, pdfFiles };
        };

        /**
         * Parses flight.backup JSON payload used for the Flight Summary tab.
         * @param {string|null} jsonText - Raw JSON string from flight.backup.
         * @returns {Object|null} Parsed summary object or null when unavailable.
         */
        const processFlightSummaryData = (jsonText) => {
            if (!jsonText) return null;
            const parsedData = JSON.parse(jsonText);
            return parsedData && typeof parsedData === 'object' ? parsedData : null;
        };

        /**
         * Converts an ISO-8601 duration (PTxHxMxS) to minutes.
         * @param {string} duration - ISO duration string.
         * @returns {number|null} Total minutes or null if invalid.
         */
        const parseDurationToMinutes = (duration) => {
            if (!duration || typeof duration !== 'string') return null;

            const durationMatch = duration.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
            if (!durationMatch) return null;

            const hours = Number(durationMatch[1] || 0);
            const minutes = Number(durationMatch[2] || 0);
            const seconds = Number(durationMatch[3] || 0);

            return hours * 60 + minutes + Math.round(seconds / 60);
        };

        /**
         * Sanitizes a limited HTML fragment from flight.backup while preserving
         * simple formatting such as line breaks, bold text, and bullet lists.
         * @param {string} htmlText - Raw HTML-like text from flight.backup.
         * @returns {string} Sanitized HTML safe for display.
         */
        const sanitizeRichText = (htmlText) => {
            if (!htmlText || typeof htmlText !== 'string') return '';

            const parser = new DOMParser();
            const documentFragment = parser.parseFromString(`<div>${htmlText}</div>`, 'text/html');
            const container = documentFragment.body.firstElementChild;

            if (!container) return '';

            const allowedTags = new Set(['B', 'STRONG', 'BR', 'UL', 'OL', 'LI', 'P']);

            const sanitizeNode = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    return document.createTextNode(node.textContent || '');
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return document.createDocumentFragment();
                }

                const tagName = node.tagName.toUpperCase();
                const sanitizedChildren = Array.from(node.childNodes).map(sanitizeNode);

                if (!allowedTags.has(tagName)) {
                    const fragment = document.createDocumentFragment();
                    sanitizedChildren.forEach((childNode) => fragment.appendChild(childNode));
                    return fragment;
                }

                const cleanElement = document.createElement(tagName.toLowerCase());
                sanitizedChildren.forEach((childNode) => cleanElement.appendChild(childNode));
                return cleanElement;
            };

            const safeWrapper = document.createElement('div');
            Array.from(container.childNodes)
                .map(sanitizeNode)
                .forEach((childNode) => safeWrapper.appendChild(childNode));

            return safeWrapper.innerHTML;
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        /**
         * Icon Component - Renders SVG icons from a predefined library.
         * Provides consistent iconography throughout the application.
         *
         * @param {Object} props - Component properties
         * @param {string} props.name - Name of the icon to render
         * @param {string} props.className - Additional CSS classes for styling
         */
        const Icon = ({ name, className = "" }) => {
            // Icon library with SVG path definitions
            const iconPaths = {
                plane: "M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z",
                upload: "M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-4-4l4 4 4-4",
                clock: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-16v6l4 2",
                droplet: "M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5s-3 3.5-3 5.5a7 7 0 0 0 7 7z",
                settings: "M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2zM9 12a3 3 0 1 1 6 0a3 3 0 0 1-6 0z"
            };

            return h('svg', {
                width: 24,
                height: 24,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className
            }, h('path', { d: iconPaths[name] || "" }));
        };

        /**
         * WelcomeScreen Component - Initial screen shown when no flight data is loaded.
         * Provides file upload interface and displays any loading errors.
         *
         * @param {Object} props - Component properties
         * @param {Function} props.onFileSelected - Callback when user selects a file
         * @param {string|null} props.error - Error message to display, if any
         */
        const WelcomeScreen = ({ onFileSelected, error }) => {
            return h('div', {
                className: "min-h-screen flex flex-col items-center justify-center p-4 text-center"
            },
                h('div', { className: "bg-white p-6 sm:p-12 rounded-3xl sm:rounded-[3rem] shadow-xl animate-in w-full max-w-sm sm:max-w-md" },
                    h(Icon, { name: "upload", className: "w-12 h-12 sm:w-16 sm:h-16 text-blue-600 mx-auto mb-4 sm:mb-6" }),
                    h('h1', { className: "text-2xl sm:text-3xl font-black mb-3 sm:mb-4" }, "FlightLog Pro"),
                    h('p', { className: "text-gray-500 mb-6 sm:mb-8" }, "Upload a ZIP/.effarchive export containing routes.backup and flight.backup"),
                    h('label', {
                        className: "bg-blue-600 text-white px-6 py-3 sm:px-8 sm:py-4 rounded-2xl font-bold cursor-pointer hover:bg-blue-700 transition-all block"
                    },
                        "Choose File",
                        h('input', {
                            type: 'file',
                            className: "hidden",
                            onChange: onFileSelected
                        })
                    ),
                    error && h('p', {
                        className: "text-red-500 mt-4 text-sm font-medium"
                    }, error)
                )
            );
        };

        /**
         * RouteHeader Component - Displays route information and close action.
         * Shows destination airport details and top-level timing overview.
         *
         * @param {Object} props - Component properties
         * @param {Object} props.route - Route data object with airport information
         * @param {string|null} props.atcCallsign - ATC callsign from flight.backup
         * @param {string|null} props.flightNumber - Flight number from flight.backup
         * @param {string|null} props.originIcao - Origin ICAO code from flight.backup
         * @param {string|null} props.destinationIcao - Destination ICAO code from flight.backup
         * @param {string|null} props.ofpVersion - OFP version from flight.backup
         * @param {Object|null} props.scheduledTimes - Scheduled time data from flight.backup
         * @param {Function} props.onClose - Callback to close the current route
         */
        const RouteHeader = ({ route, atcCallsign, flightNumber, originIcao, destinationIcao, ofpVersion, scheduledTimes }) => {
            const headerTitle = `${flightNumber || 'N/A'} - ${ofpVersion || 'N/A'}`;
            const headerSubtitle = `${originIcao || 'N/A'} ${destinationIcao || 'N/A'}`;

            const formatUtcTimeOnly = (isoString) => {
                if (!isoString) return '-';
                const date = new Date(isoString);
                if (isNaN(date)) return '-';
                const hours = String(date.getUTCHours()).padStart(2, '0');
                const minutes = String(date.getUTCMinutes()).padStart(2, '0');
                return `${hours}:${minutes}Z`;
            };

            const formatDurationCompact = (isoDuration) => {
                const totalMinutes = parseDurationToMinutes(isoDuration);
                if (totalMinutes === null) return '-';

                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;

                if (hours === 0) return `${minutes} min`;
                return `${hours}h ${minutes}m`;
            };

            const topRowFields = [
                { label: 'Off Block', value: formatUtcTimeOnly(scheduledTimes?.offBlock) },
                { label: 'Taxi Out', value: scheduledTimes?.taxiOut !== undefined ? `${scheduledTimes.taxiOut} min` : '-' },
                { label: 'Take Off', value: formatUtcTimeOnly(scheduledTimes?.takeOffDate) }
            ];

            const bottomRowFields = [
                { label: 'Landing', value: formatUtcTimeOnly(scheduledTimes?.landingDate) },
                { label: 'Taxi In', value: scheduledTimes?.taxiIn !== undefined ? `${scheduledTimes.taxiIn} min` : '-' },
                { label: 'On Block', value: formatUtcTimeOnly(scheduledTimes?.onBlock) }
            ];

            const flightTimeValue = formatDurationCompact(scheduledTimes?.trip);

            return h('div', {
                className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm mb-4 sm:mb-8 flex flex-wrap justify-between items-center gap-4"
            },
                h('div', { className: "min-w-0" },
                    h('p', { className: "text-blue-600 text-[10px] font-bold uppercase tracking-widest" }, atcCallsign || "-"),
                    h('h2', { className: "text-xl sm:text-3xl font-black truncate" }, headerTitle),
                    h('div', { className: "flex flex-wrap items-center gap-2 text-gray-400 font-bold" },
                        h('span', { className: "uppercase tracking-wide" }, headerSubtitle)
                    ),
                    h('div', { className: "space-y-3 mt-3 sm:mt-4" },
                        h('div', { className: "grid grid-cols-3 gap-x-3 sm:gap-x-4" },
                            topRowFields.map((field) => h('div', { key: field.label, className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, field.label),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, field.value)
                            ))
                        ),
                        h('div', { className: "grid grid-cols-3 gap-x-3 sm:gap-x-4" },
                            bottomRowFields.map((field) => h('div', { key: field.label, className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, field.label),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, field.value)
                            ))
                        ),
                        h('div', { className: "grid grid-cols-1" },
                            h('div', { className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, "Flight Time"),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, flightTimeValue)
                            )
                        )
                    )
                ),
            );
        };

        /**
         * WaypointCard Component - Displays detailed information for a single flight waypoint.
         * Shows planned vs actual times, fuel consumption, and other flight parameters.
         * Includes interactive controls for entering actual flight data.
         *
         * @param {Object} props - Component properties
         * @param {Object} props.waypoint - Waypoint data object
         * @param {number} props.index - Position in the waypoint sequence
         * @param {Array<string>} props.selectedColumns - Additional columns to display
         */
        const WaypointCard = ({ waypoint, index, selectedColumns }) => {
            // Format planned data
            const plannedTimeStr = formatTime(waypoint.passingByDate);
            const fuelData = formatFuel(waypoint.fuel);

            // State for actual flight data input
            const [actualData, setActualData] = useState({
                time: "",
                used: "",
                remaining: ""
            });

            // Track focus state for smart input behavior
            const [inputFocusState, setInputFocusState] = useState({
                usedFocused: false,
                remainingFocused: false
            });

            // Calculate differences between planned and actual values
            const plannedTimeMinutes = timeToMinutes(plannedTimeStr);
            const actualTimeMinutes = timeToMinutes(actualData.time);
            const timeDifference = (plannedTimeMinutes !== null && actualTimeMinutes !== null)
                ? actualTimeMinutes - plannedTimeMinutes
                : null;

            const fuelUsedDifference = (fuelData?.numCumulated !== undefined && actualData.used !== "")
                ? Number(actualData.used) - fuelData.numCumulated
                : null;

            const fuelRemainingDifference = (fuelData?.numRemaining !== undefined && actualData.remaining !== "")
                ? Number(actualData.remaining) - fuelData.numRemaining
                : null;

            // ==========================================
            // TIME INPUT HELPERS
            // ==========================================

            /**
             * Parses a time string into hours and minutes components.
             * @param {string} timeString - Time in HH:MM format
             * @returns {Object} Object with hours and minutes properties
             */
            const parseTimeComponents = (timeString) => {
                if (!timeString) return { hours: 0, minutes: 0 };
                const [hours, minutes] = timeString.split(':').map(Number);
                return {
                    hours: isNaN(hours) ? 0 : hours,
                    minutes: isNaN(minutes) ? 0 : minutes
                };
            };

            /**
             * Formats hours and minutes back into HH:MM string format.
             * @param {number} hours - Hours (0-23)
             * @param {number} minutes - Minutes (0-59)
             * @returns {string} Formatted time string
             */
            const formatTimeComponents = (hours, minutes) => {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            };

            /**
             * Increments the actual time by one minute.
             * Uses planned time as base if no actual time is set.
             */
            const incrementTime = () => {
                const baseTime = actualData.time || plannedTimeStr.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes + 1;
                let newHours = hours;

                if (newMinutes >= 60) {
                    newMinutes = 0;
                    newHours = (newHours + 1) % 24;
                }

                setActualData(prev => ({
                    ...prev,
                    time: formatTimeComponents(newHours, newMinutes)
                }));
            };

            /**
             * Decrements the actual time by one minute.
             * Uses planned time as base if no actual time is set.
             */
            const decrementTime = () => {
                const baseTime = actualData.time || plannedTimeStr.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes - 1;
                let newHours = hours;

                if (newMinutes < 0) {
                    newMinutes = 59;
                    newHours = (newHours - 1 + 24) % 24;
                }

                setActualData(prev => ({
                    ...prev,
                    time: formatTimeComponents(newHours, newMinutes)
                }));
            };

            // ==========================================
            // FUEL INPUT HELPERS
            // ==========================================

            /**
             * Increments fuel used by the standard step amount.
             * On first use with empty field, rounds planned value up to next step boundary.
             */
            const incrementFuelUsed = () => {
                if (!actualData.used) {
                    // Initialize with rounded-up planned value
                    const plannedValue = fuelData.numCumulated;
                    const nextStepBoundary = Math.ceil(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, used: String(nextStepBoundary) }));
                } else {
                    // Increment existing value
                    const currentValue = Number(actualData.used);
                    setActualData(prev => ({ ...prev, used: String(currentValue + FUEL_STEP) }));
                }
            };

            /**
             * Decrements fuel used by the standard step amount.
             * On first use with empty field, rounds planned value down to previous step boundary.
             */
            const decrementFuelUsed = () => {
                if (!actualData.used) {
                    // Initialize with rounded-down planned value
                    const plannedValue = fuelData.numCumulated;
                    const prevStepBoundary = Math.floor(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({
                        ...prev,
                        used: String(Math.max(0, prevStepBoundary))
                    }));
                } else {
                    // Decrement existing value
                    const currentValue = Number(actualData.used);
                    setActualData(prev => ({
                        ...prev,
                        used: String(Math.max(0, currentValue - FUEL_STEP))
                    }));
                }
            };

            /**
             * Increments remaining fuel by the standard step amount.
             * On first use with empty field, rounds planned value up to next step boundary.
             */
            const incrementFuelRemaining = () => {
                if (!actualData.remaining) {
                    // Initialize with rounded-up planned value
                    const plannedValue = fuelData.numRemaining;
                    const nextStepBoundary = Math.ceil(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, remaining: String(nextStepBoundary) }));
                } else {
                    // Increment existing value
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({ ...prev, remaining: String(currentValue + FUEL_STEP) }));
                }
            };

            /**
             * Decrements remaining fuel by the standard step amount.
             * On first use with empty field, rounds planned value down to previous step boundary.
             */
            const decrementFuelRemaining = () => {
                if (!actualData.remaining) {
                    // Initialize with rounded-down planned value
                    const plannedValue = fuelData.numRemaining;
                    const prevStepBoundary = Math.floor(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({
                        ...prev,
                        remaining: String(Math.max(0, prevStepBoundary))
                    }));
                } else {
                    // Decrement existing value
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({
                        ...prev,
                        remaining: String(Math.max(0, currentValue - FUEL_STEP))
                    }));
                }
            };

            // ==========================================
            // INPUT CHANGE HANDLERS
            // ==========================================

            /**
             * Handles changes to the fuel used input field.
             * Provides smart initialization on first input.
             */
            const handleFuelUsedChange = (event) => {
                const newValue = event.target.value;
                if (actualData.used === "" && newValue !== "") {
                    // Pre-fill with planned value on first input
                    setActualData(prev => ({ ...prev, used: String(fuelData.numCumulated) }));
                } else {
                    setActualData(prev => ({ ...prev, used: newValue }));
                }
            };

            /**
             * Handles changes to the fuel remaining input field.
             * Provides smart initialization on first input.
             */
            const handleFuelRemainingChange = (event) => {
                const newValue = event.target.value;
                if (actualData.remaining === "" && newValue !== "") {
                    // Pre-fill with planned value on first input
                    setActualData(prev => ({ ...prev, remaining: String(fuelData.numRemaining) }));
                } else {
                    setActualData(prev => ({ ...prev, remaining: newValue }));
                }
            };

            // ==========================================
            // STYLING HELPERS
            // ==========================================

            /**
             * Determines color styling for difference values based on whether they're positive, negative, or zero.
             * @param {number} difference - The difference value to style
             * @returns {string} CSS class for coloring the difference
             */
            const getDifferenceColor = (difference) => {
                if (difference === 0) return "text-gray-400";
                return difference > 0 ? "text-red-500" : "text-emerald-500";
            };

            // Calculate grid layout based on selected columns
            const baseColumnCount = 4; // Label + Time + Used + Remaining
            const extraColumnCount = selectedColumns?.length || 0;
            const gridColumnTemplate = `grid-cols-[56px_100px_100px_100px${'_100px'.repeat(extraColumnCount)}]`;

            // ==========================================
            // RENDER COMPONENT
            // ==========================================

            return h('div', { className: "bg-white p-3 sm:p-6 rounded-3xl shadow-sm flex items-start gap-3 sm:gap-6" },
                // Waypoint index (hidden for now)
                h('div', { className: "hidden w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center font-black text-gray-300 mt-1" }, index + 1),

                // Main content area
                h('div', { className: "flex-1 overflow-x-auto -mx-3 sm:mx-0 px-3 sm:px-0" },
                    // Waypoint title
                    h('div', { className: "font-black text-base sm:text-xl text-gray-800 mb-2 truncate" }, waypoint.title || "Unnamed Fix"),

                    // Data grid
                    h('div', { className: `grid ${gridColumnTemplate} gap-x-6 gap-y-0 min-w-max` },

                        // Header Row
                        h('div', { className: "contents" },
                            h('div', null), // Empty for label column
                            h('div', { className: UI_STYLES.header }, "Time"),
                            fuelData?.cumulated && h('div', { className: UI_STYLES.header }, "Used"),
                            fuelData?.remaining && h('div', { className: UI_STYLES.header }, "Remaining"),
                            selectedColumns.map(col => h('div', {
                                key: col,
                                className: UI_STYLES.header
                            }, getColumnLabel(col)))
                        ),

                        // Planned Values Row
                        h('div', { className: "contents" },
                            h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.label }, "Planned"),
                            h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.value }, plannedTimeStr),
                            fuelData?.cumulated && h('div', { className: UI_STYLES.rowHeight + " font-bold text-[9px]" }, fuelData.cumulated),
                            fuelData?.remaining && h('div', { className: UI_STYLES.rowHeight + " font-bold text-[9px]" }, fuelData.remaining),
                            selectedColumns.map(col => h('div', {
                                key: col,
                                className: UI_STYLES.rowHeight + " " + UI_STYLES.value
                            }, getNestedValue(waypoint, col) || "-"))
                        ),

                        // Actual Values Row (Interactive)
                        h('div', { className: "contents" },
                            h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.label + " text-blue-500" }, "Actual"),

                            // Time input with increment/decrement controls
                            h('div', { className: UI_STYLES.rowHeight + " flex gap-0.5 items-center" },
                                h('input', {
                                    type: 'text',
                                    className: UI_STYLES.input,
                                    placeholder: "HH:MM",
                                    value: actualData.time,
                                    onChange: (e) => {
                                        const newValue = e.target.value;
                                        if (actualData.time === "" && newValue !== "") {
                                            // Pre-fill with planned time on first input
                                            const timeWithoutZ = plannedTimeStr.split('Z')[0];
                                            setActualData(prev => ({ ...prev, time: timeWithoutZ }));
                                        } else {
                                            setActualData(prev => ({ ...prev, time: newValue }));
                                        }
                                    }
                                }),
                                h('div', { className: "flex flex-row gap-0.5" },
                                    h('button', {
                                        onClick: decrementTime,
                                        className: UI_STYLES.button
                                    }, "▼"),
                                    h('button', {
                                        onClick: incrementTime,
                                        className: UI_STYLES.button
                                    }, "▲")
                                )
                            ),

                            // Fuel used input (conditional rendering)
                            fuelData?.cumulated && h('div', { className: UI_STYLES.rowHeight + " flex gap-0.5 items-center" },
                                h('input', {
                                    type: 'number',
                                    className: UI_STYLES.input,
                                    placeholder: "Used",
                                    value: actualData.used,
                                    onChange: handleFuelUsedChange
                                }),
                                h('div', { className: "flex flex-row gap-0.5" },
                                    h('button', {
                                        onClick: decrementFuelUsed,
                                        className: UI_STYLES.button
                                    }, "▼"),
                                    h('button', {
                                        onClick: incrementFuelUsed,
                                        className: UI_STYLES.button
                                    }, "▲")
                                )
                            ),

                            // Fuel remaining input (conditional rendering)
                            fuelData?.remaining && h('div', { className: UI_STYLES.rowHeight + " flex gap-0.5 items-center" },
                                h('input', {
                                    type: 'number',
                                    className: UI_STYLES.input,
                                    placeholder: "Rem",
                                    value: actualData.remaining,
                                    onChange: handleFuelRemainingChange
                                }),
                                h('div', { className: "flex flex-row gap-0.5" },
                                    h('button', {
                                        onClick: decrementFuelRemaining,
                                        className: UI_STYLES.button
                                    }, "▼"),
                                    h('button', {
                                        onClick: incrementFuelRemaining,
                                        className: UI_STYLES.button
                                    }, "▲")
                                )
                            ),

                            // Empty cells for dynamic columns
                            selectedColumns.map(col => h('div', { key: col, className: UI_STYLES.rowHeight }))
                        ),

                        // Difference Row
                        h('div', { className: "contents" },
                            h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.label }, "Diff"),
                            h('div', { className: UI_STYLES.rowHeight + " font-bold text-[10px] " + getDifferenceColor(timeDifference) }, formatDiff(timeDifference, "min")),
                            fuelData?.cumulated && h('div', { className: UI_STYLES.rowHeight + " font-bold text-[10px] " + getDifferenceColor(fuelUsedDifference) }, formatDiff(fuelUsedDifference)),
                            fuelData?.remaining && h('div', { className: UI_STYLES.rowHeight + " font-bold text-[10px] " + getDifferenceColor(-fuelRemainingDifference) }, formatDiff(fuelRemainingDifference)),
                            // Empty cells for dynamic columns
                            selectedColumns.map(col => h('div', { key: col, className: UI_STYLES.rowHeight }))
                        )
                    )
                )
            );
        };

        /**
         * FlightSummaryPage - Displays high-level flight plan details from flight.backup.
         * Uses the app's existing card and typography design language.
         *
         * @param {Object} props - Component properties
         * @param {Object|null} props.summary - Parsed flight backup object
         */
        const FlightSummaryPage = ({ summary }) => {
            if (!summary) {
                return h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm text-center text-gray-500" },
                    h('h3', { className: "text-lg font-bold mb-2" }, "Flight Summary"),
                    h('p', null, "No flight.backup data found in this archive.")
                );
            }

            const formatValueWithUnit = (valueWithUnit) => {
                if (!valueWithUnit || valueWithUnit.value === undefined) return "-";
                const formattedValue = formatNumber(valueWithUnit.value);
                const rawUnit = valueWithUnit.unit || '';

                if (rawUnit.toLowerCase() === 'c') {
                    return `${formattedValue}°`;
                }

                return formatUnit(rawUnit, formattedValue);
            };

            const formatFlightLevel = (valueWithUnit) => {
                if (!valueWithUnit || valueWithUnit.value === undefined) return "-";
                return `FL${formatNumber(valueWithUnit.value)}`;
            };

            const formatSignedPercent = (valueWithUnit) => {
                if (!valueWithUnit || valueWithUnit.value === undefined) return "-";
                const numericValue = Number(valueWithUnit.value);
                if (isNaN(numericValue)) return "-";
                const sign = numericValue > 0 ? '+' : '';
                return `${sign}${numericValue} %`;
            };

            const formatAverageWind = (windData) => {
                if (!windData || windData.value === undefined) return "-";
                const numericValue = Number(windData.value);
                if (isNaN(numericValue)) return "-";

                const windPrefix = numericValue < 0 ? 'H' : 'T';
                const windMagnitude = String(Math.abs(Math.round(numericValue))).padStart(3, '0');
                const unit = String(windData.unit || 'kt').toUpperCase();
                return `${windPrefix}${windMagnitude} ${unit}`;
            };

            const formatAirportAndRunway = (airport, runway) => {
                const airportCode = airport?.icaoCode || airport?.iataCode || "-";
                return `${airportCode}${runway ? ` ${runway}` : ''}`;
            };

            const summaryInfo = summary.summaryAdditionalInfo || {};
            const etopsMinutes = parseDurationToMinutes(summaryInfo.diversion);
            const atcText = typeof summary.ATC === 'string' ? summary.ATC.trim() : '';
            const dispatcherRemarks = Array.isArray(summary.remarks?.dispatcher) ? summary.remarks.dispatcher.filter(Boolean) : [];
            const melCdlRemarks = Array.isArray(summary.remarks?.MELCDL) ? summary.remarks.MELCDL.filter(Boolean) : [];
            const dispatcherRemarksText = dispatcherRemarks.join('\n') || '-';
            const melCdlRemarksText = melCdlRemarks.join('\n') || '-';
            const optiClimbHtml = sanitizeRichText(
                summary.optiClimb || summary.recommendations?.opti?.find((entry) =>
                    /opticlimb/i.test(entry?.title || '') || /opticlimb/i.test(entry?.text || '')
                )?.text || ''
            );

            const rowsLeft = [
                { label: 'AC type', value: summary.acType || '-' },
                { label: 'Callsign', value: summary.atcCallsign || '-' },
                { label: 'Departure airport', value: formatAirportAndRunway(summary.originAirport, summary.runways?.departure) },
                { label: 'Mach', value: summary.machString || '-' },
                { label: 'Ground distance', value: formatValueWithUnit(summary.groundDistance) },
                { label: 'TOC FL', value: formatFlightLevel(summary.TOC_FL) },
                { label: 'TOC-TOD avg. wind', value: formatAverageWind(summary.averageWind) },
                { label: 'Arrival airport', value: formatAirportAndRunway(summary.destinationAirport, summary.runways?.destination) }
            ];

            const rowsRight = [
                { label: 'Registration', value: summary.aircraftId || '-' },
                { label: 'Fuel flow factor', value: formatSignedPercent(summary.fuelFlowFactor) },
                { label: 'SID', value: summary.SID || '-' },
                { label: 'Cost index (CI)', value: summary.costIndex !== undefined ? `CI ${summary.costIndex}` : '-' },
                { label: 'Air distance', value: formatValueWithUnit(summary.airDistance) },
                { label: 'TOC tropopause', value: formatFlightLevel(summary.tropopauseFL) },
                { label: 'TOC OAT', value: formatValueWithUnit(summary.OAT) },
                { label: 'STAR', value: summary.STAR || '-' }
            ];

            const bottomLeft = [
                { label: 'Take off alternate', value: summaryInfo.takeOffAlternate || summaryInfo.takeoffAlternate || '-' },
                { label: 'Max. ETOPS diversion time', value: etopsMinutes !== null ? `${etopsMinutes} min` : '-' },
                { label: 'Dispatcher', value: summaryInfo.dispatcherName || '-' }
            ];

            const bottomRight = [
                { label: 'Destination Alternate', value: summaryInfo.destinationAlternate || '-' },
                { label: 'ETOPS Alternates', value: Array.isArray(summaryInfo.alternates) && summaryInfo.alternates.length > 0 ? summaryInfo.alternates.join('   ') : '-' }
            ];

            const SummaryRow = ({ label, value }) => h('div', { className: "grid grid-cols-[minmax(150px,1fr)_minmax(120px,1fr)] gap-3 sm:gap-6 py-1.5" },
                h('p', { className: "text-gray-400 font-medium text-sm sm:text-base" }, label),
                h('p', { className: "text-gray-700 font-extrabold text-sm sm:text-xl leading-tight" }, value)
            );

            return h('div', { className: "space-y-4 sm:space-y-6" },
                h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('div', { className: "flex items-center gap-3 mb-4 sm:mb-6" },
                        h('h3', { className: "text-base sm:text-xl font-black text-gray-800" }, "Flight Plan Summary"),
                        summaryInfo.isETOPS && h('span', { className: "px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700 tracking-wide" }, "ETOPS")
                    ),

                    h('div', { className: "grid grid-cols-1 xl:grid-cols-2 gap-6 xl:gap-10" },
                        h('div', { className: "space-y-1" }, rowsLeft.map((row) => h(SummaryRow, { key: row.label, label: row.label, value: row.value }))),
                        h('div', { className: "space-y-1" }, rowsRight.map((row) => h(SummaryRow, { key: row.label, label: row.label, value: row.value })))
                    ),

                    h('div', { className: "border-t border-gray-200 my-6 sm:my-8" }),

                    h('div', { className: "grid grid-cols-1 xl:grid-cols-2 gap-6 xl:gap-10" },
                        h('div', { className: "space-y-1" }, bottomLeft.map((row) => h(SummaryRow, { key: row.label, label: row.label, value: row.value }))),
                        h('div', { className: "space-y-1" }, bottomRight.map((row) => h(SummaryRow, { key: row.label, label: row.label, value: row.value })))
                    )
                ),

                optiClimbHtml && h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-base sm:text-xl font-black text-gray-800 mb-4 sm:mb-6 uppercase" }, "OptiClimb"),
                    h('div', {
                        className: "text-sm sm:text-base text-gray-700 leading-relaxed [&_b]:font-extrabold [&_strong]:font-extrabold [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:my-2 [&_ol]:list-decimal [&_ol]:pl-5 [&_ol]:my-2 [&_li]:my-1 [&_p]:my-2",
                        dangerouslySetInnerHTML: { __html: optiClimbHtml }
                    })
                ),

                atcText && h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-base sm:text-xl font-black text-gray-800 mb-4 sm:mb-6 uppercase" }, "ATC Flight Plan"),
                    h('pre', {
                        className: "whitespace-pre-wrap break-words text-xs sm:text-sm leading-relaxed text-gray-700 bg-gray-50 rounded-2xl p-4 overflow-x-auto font-mono"
                    }, atcText)
                ),

                h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-base sm:text-xl font-black text-gray-800 mb-4 sm:mb-6 uppercase" }, "Dispatcher Remarks"),
                    h('pre', {
                        className: "whitespace-pre-wrap break-words text-xs sm:text-sm leading-relaxed text-gray-700 bg-gray-50 rounded-2xl p-4 overflow-x-auto font-mono"
                    }, dispatcherRemarksText)
                ),

                h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-base sm:text-xl font-black text-gray-800 mb-4 sm:mb-6 uppercase" }, "MEL/CDL ITEMS"),
                    h('pre', {
                        className: "whitespace-pre-wrap break-words text-xs sm:text-sm leading-relaxed text-gray-700 bg-gray-50 rounded-2xl p-4 overflow-x-auto font-mono"
                    }, melCdlRemarksText)
                )
            );
        };

        /**
         * PdfDocumentsPage - Displays PDF documents extracted from the archive.
         * Renders a selectable list and an embedded browser PDF viewer.
         *
         * @param {Object} props - Component properties
         * @param {Array<{name: string, url: string}>} props.pdfDocuments - Extracted PDF documents

         * @param {Function} props.onSelectPdf - Callback to switch selected PDF

                            key: activeDocument.url,
                            src: activeDocument.url,

         * Each column specifies a data path, human-readable label, and default visibility.
         * These can be toggled on/off in the settings panel.
         */
        const STATIC_COLUMNS = [
            { path: 'averages.altitude', label: 'Altitude (Avg)', defaultVisible: false },
            { path: 'averages.groundSpeed', label: 'Ground Speed (Avg)', defaultVisible: false },
            { path: 'averages.isaDeviation', label: 'ISA Deviation', defaultVisible: false },
            { path: 'indicatedAirSpeed.value', label: 'Indicated Air Speed', defaultVisible: false },
            { path: 'tracks.outbound.magnetic', label: 'Track Outbound (Magnetic)', defaultVisible: false },
            { path: 'tracks.outbound.true', label: 'Track Outbound (True)', defaultVisible: false },
            { path: 'tracks.segment.magnetic', label: 'Track Segment (Magnetic)', defaultVisible: false },
            { path: 'tracks.segment.true', label: 'Track Segment (True)', defaultVisible: false },
            { path: 'tropopause.value', label: 'Tropopause', defaultVisible: false },
            { path: 'temperature.value', label: 'Temperature', defaultVisible: false },
            { path: 'windComponent.value', label: 'Wind Component', defaultVisible: false },
            { path: 'windShear.value', label: 'Wind Shear', defaultVisible: false },
            { path: 'coordinates', label: 'Coordinates', defaultVisible: false },
            { path: 'averages.machSpeed', label: 'Mach Speed (Avg)', defaultVisible: false },
            { path: 'averages.minimumSafeAltitude.value', label: 'Min Safe Altitude', defaultVisible: false },
            { path: 'groundDistance.value', label: 'Ground Distance', defaultVisible: false },
            { path: 'averages.trueAirSpeed', label: 'True Air Speed (Avg)', defaultVisible: false }
        ];

        /**
         * Gets the human-readable label for a column path.
         * Falls back to a formatted version of the path if no label is found.
         * @param {string} path - The column data path
         * @returns {string} Human-readable column label
         */
        const getColumnLabel = (path) => {
            const columnDefinition = STATIC_COLUMNS.find(col => col.path === path);
            return columnDefinition ? columnDefinition.label : path.split('.').pop();
        };

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================

        /**
         * Main App Component - Root component managing the flight log application state.
         * Handles file uploads, route data management, and UI state for settings panel.
         */
        const App = () => {
            // Application state
            const [routeData, setRouteData] = useState(null);
            const [flightSummaryData, setFlightSummaryData] = useState(null);
            const [errorMessage, setErrorMessage] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [selectedColumns, setSelectedColumns] = useState([]);
            const [selectedPage, setSelectedPage] = useState('summary');
            const [pdfDocuments, setPdfDocuments] = useState([]);
            const [selectedPdfIndex, setSelectedPdfIndex] = useState(0);

            useEffect(() => {
                return () => {
                    pdfDocuments.forEach((documentItem) => {
                        if (documentItem?.url) {
                            URL.revokeObjectURL(documentItem.url);
                        }
                    });
                };
            }, [pdfDocuments]);

            /**
             * Handles file upload and processing.
             * Reads the uploaded file, processes the flight data, and updates application state.
             * @param {Event} event - File input change event
             */
            const handleFileUpload = async (event) => {
                const selectedFile = event.target.files[0];
                if (!selectedFile) return;

                try {
                    const { routesBackupText, flightBackupText, pdfFiles } = await readBackupFilesFromArchive(selectedFile);
                    const processedRoute = processFlightData(routesBackupText);
                    const processedSummary = processFlightSummaryData(flightBackupText);
                    const mappedPdfDocuments = pdfFiles.map((pdfFile) => ({
                        name: pdfFile.name,
                        url: URL.createObjectURL(pdfFile.blob)
                    }));

                    setRouteData(processedRoute);
                    setFlightSummaryData(processedSummary);
                    setPdfDocuments(mappedPdfDocuments);
                    setSelectedPdfIndex(0);
                    setSelectedPage('summary');
                    setErrorMessage(null);
                } catch (processingError) {
                    setErrorMessage("Error loading file: " + processingError.message);
                }

                // Reset file input
                event.target.value = '';
            };

            /**
             * Toggles visibility of a column in the waypoint display.
             * @param {string} columnPath - The path of the column to toggle
             */
            const toggleColumnVisibility = (columnPath) => {
                setSelectedColumns(prevSelected =>
                    prevSelected.includes(columnPath)
                        ? prevSelected.filter(path => path !== columnPath)
                        : [...prevSelected, columnPath]
                );
            };

            // Show welcome screen if no route data is loaded
            if (!routeData) {
                return h(WelcomeScreen, {
                    onFileSelected: handleFileUpload,
                    error: errorMessage
                });
            }

            // Main application interface
            return h('div', { className: "max-w-6xl mx-auto p-3 sm:p-6 animate-in" },

                // Subpage menu (Flight Summary / OFP) + Settings button
                h('div', { className: "flex items-center gap-3 mb-4 sm:mb-6" },
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'summary' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => {
                            setSelectedPage('summary');
                            setShowSettings(false);
                        }
                    }, 'Flight Summary'),
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'OFP' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => setSelectedPage('OFP')
                    }, 'OFP'),
                    h('button', {
                        className: `px-4 py-2 rounded-2xl font-bold transition ${selectedPage === 'documents' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                        onClick: () => {
                            setSelectedPage('documents');
                            setShowSettings(false);
                        }
                    }, 'Documents'),
                    h('div', { className: "relative ml-auto" },
                        h('button', {
                            onClick: () => setShowSettings(!showSettings),
                            className: "text-gray-400 hover:text-gray-600 font-bold text-sm bg-white border border-gray-200 hover:border-gray-300 p-2 rounded-lg transition-colors shadow-sm",
                            'aria-label': 'Toggle column settings',
                            title: 'Column settings'
                        }, h(Icon, { name: "settings", className: "w-4 h-4" })),
                        showSettings && h('div', {
                            className: "absolute top-11 right-0 z-20 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 w-[min(92vw,440px)] animate-in"
                        },
                            // Flight Summary section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Flight Summary"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "No settings"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Documents"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "Select PDFs directly on the Documents tab"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            // OFP section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-3" }, "OFP Columns"),
                            h('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3" },
                                STATIC_COLUMNS
                                    .slice()
                                    .sort((a, b) => a.label.localeCompare(b.label))
                                    .map(column => h('label', {
                                        key: column.path,
                                        className: "flex items-center gap-2.5 cursor-pointer group"
                                    },
                                        h('input', {
                                            type: 'checkbox',
                                            className: "w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500",
                                            checked: selectedColumns.includes(column.path),
                                            onChange: () => toggleColumnVisibility(column.path)
                                        }),
                                        h('span', { className: "text-sm font-bold text-gray-500 group-hover:text-gray-800" }, column.label)
                                    ))
                            ),

                            h('div', { className: "border-t border-gray-100 mt-1 mb-3" }),

                            // Close flight action
                            h('button', {
                                onClick: () => {
                                    setShowSettings(false);
                                    setRouteData(null);
                                    setFlightSummaryData(null);
                                    setPdfDocuments([]);
                                    setSelectedPdfIndex(0);
                                },
                                className: "w-full text-left text-sm font-bold text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors"
                            }, "Close Flight")
                        )
                    )
                ),

                // Route header with destination info and controls
                h(RouteHeader, {
                    route: routeData,
                    atcCallsign: flightSummaryData?.atcCallsign || null,
                    flightNumber: flightSummaryData?.flightNumber || null,
                    originIcao: flightSummaryData?.originAirport?.icaoCode || null,
                    destinationIcao: flightSummaryData?.destinationAirport?.icaoCode || null,
                    ofpVersion: flightSummaryData?.ofpVersion || null,
                    scheduledTimes: flightSummaryData?.scheduledTimes || null
                }),

                // Page content (Summary, OFP, or Documents)
                selectedPage === 'OFP'
                    ? h('div', { className: "space-y-4" },
                        (routeData.waypoints || []).map((waypoint, index) =>
                            h(WaypointCard, {
                                key: waypoint.UUID || index,
                                waypoint: waypoint,
                                index: index,
                                selectedColumns: selectedColumns
                            })
                        )
                    )
                    : selectedPage === 'documents'
                        ? h(PdfDocumentsPage, {
                            pdfDocuments,
                            selectedPdfIndex,
                            onSelectPdf: setSelectedPdfIndex
                        })
                        : h(FlightSummaryPage, { summary: flightSummaryData })
            );
        };

        // ==========================================
        // APPLICATION INITIALIZATION
        // ==========================================

        // Create React root and render the main App component
        // This initializes the FlightLog Pro application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>

</html>
