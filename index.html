<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightLog Pro - Stable Edition</title>
    <!-- React Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
        crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin></script>
    <!-- PDF.js for in-browser PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F5F7;
            font-family: -apple-system, system-ui, sans-serif;
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        /* Prevent 300ms tap delay on mobile */
        button, input, label {
            touch-action: manipulation;
        }

        /* Ensure minimum touch target size */
        button {
            min-height: 28px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        // Extract required hooks and functions from the global React object
        const { useState, useEffect, useRef, createElement: h } = React;

        // ==========================================
        // CONSTANTS & CONFIGURATION
        // ==========================================

        // UI Style constants for consistent styling across components
        const UI_STYLES = {
            header: "text-[10px] uppercase font-bold text-gray-400 tracking-wider mb-1",
            label: "text-[10px] uppercase font-bold text-gray-400 tracking-wider",
            value: "text-[10px] font-bold text-gray-700",
            rowHeight: "h-7 flex items-center",
            input: "w-full bg-gray-50 border-none rounded px-2 py-0.5 font-bold text-[11px] text-blue-600 placeholder:text-gray-300 focus:ring-1 focus:ring-blue-100 outline-none h-7",
            button: "px-3 py-0.5 bg-gray-50 hover:bg-gray-100 rounded text-gray-400 hover:text-gray-600 text-[8px] font-bold leading-none transition-colors"
        };

        // Standard step size for fuel stepper buttons (▲/▼) in the EFB fuel check workflow.
        // Pilots tap up/down to adjust actual fuel values in 100-unit (KG or LBS) increments,
        // matching typical EFB flight folder conventions.
        const FUEL_STEP = 100;

        // ==========================================
        // UTILITY & FORMATTING FUNCTIONS
        // ==========================================

        /**
         * Formats an ISO date string into a localized time string (HH:MMZ).
         * Used for displaying planned and actual waypoint times.
         * @param {string} isoString - The ISO date string to format.
         * @returns {string} Formatted time string or "-" if invalid.
         */
        const formatTime = (isoString) => {
            if (!isoString) return "-";
            const date = new Date(isoString);
            return isNaN(date) ? "-" : date.toLocaleTimeString([], {
                timeZone: 'UTC',
                hour: '2-digit',
                minute: '2-digit'
            }) + 'Z';
        };

        /**
         * Formats an ISO date string into UTC time only (HH:MMZ).
         * @param {string} isoString - The ISO date string to format.
         * @returns {string} Formatted UTC time or "-" if invalid.
         */
        const formatUtcTimeOnly = (isoString) => {
            if (!isoString) return '-';
            const date = new Date(isoString);
            if (isNaN(date)) return '-';
            const hours = String(date.getUTCHours()).padStart(2, '0');
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            return `${hours}:${minutes}Z`;
        };

        /**
         * Formats fuel data into a readable string and raw numbers for calculation.
         * Handles both remaining and cumulative fuel values with units.
         * @param {Object} fuel - The fuel object from the waypoint data.
         * @returns {Object|null} Formatted fuel data with display strings and raw numbers.
         */
        const formatFuel = (fuel) => {
            if (!fuel) return null;

            const formatFuelValue = (value, unit) => {
                if (value === undefined) return null;
                return `${value} ${unit || ''}`.trim();
            };

            return {
                remaining: formatFuelValue(fuel.remaining, fuel.unit),
                cumulated: formatFuelValue(fuel.cumulated, fuel.unit),
                numRemaining: fuel.remaining,
                numCumulated: fuel.cumulated
            };
        };

        /**
         * Converts a time string (HH:MMZ) to total minutes since midnight.
         * Used for calculating time differences between planned and actual times.
         * @param {string} timeString - Time string in HH:MMZ format.
         * @returns {number|null} Total minutes or null if invalid.
         */
        const timeToMinutes = (timeString) => {
            if (!timeString || timeString === "-") return null;
            const timePart = timeString.split('Z')[0];
            const [hours, minutes] = timePart.split(':').map(Number);
            return isNaN(hours) || isNaN(minutes) ? null : hours * 60 + minutes;
        };

        /**
         * Formats a numeric difference with a plus/minus sign and optional unit.
         * Used for displaying deviations from planned values.
         * @param {number|null} difference - The numeric difference to format.
         * @param {string} unit - Optional unit string (e.g., "min", "kg").
         * @returns {string} Formatted difference string.
         */
        const formatDiff = (difference, unit = "") => {
            if (difference === null || difference === undefined || isNaN(difference)) return "-";
            const sign = difference > 0 ? "+" : (difference < 0 ? "" : "");
            const formattedValue = `${sign}${difference}`;
            return unit ? `${formattedValue} ${unit}` : formattedValue;
        };

        /**
         * Extracts track value from nested tracks array structure.
         * Handles complex paths like "tracks.segment.true" or "tracks.outbound.magnetic".
         * @param {Object} waypoint - The waypoint object containing tracks data.
         * @param {string} path - The field path (e.g., "tracks.segment.true").
         * @returns {Object|null} The track value object with {value, unit} or null.
         */
        const extractTrackValue = (waypoint, path) => {
            if (!waypoint || !path.startsWith('tracks.')) return null;

            const parts = path.split('.');
            if (parts.length !== 3) return null;

            const [tracksKey, segmentKey, typeKey] = parts;
            const tracksObj = waypoint.tracks;

            if (!tracksObj || !tracksObj[segmentKey] || !Array.isArray(tracksObj[segmentKey])) {
                return null;
            }

            const trackArray = tracksObj[segmentKey];
            const trackObj = trackArray.find(track => track.type === typeKey);

            return trackObj || null;
        };

        /**
         * Formats a numeric value with thousand separators for better readability.
         * @param {number|string} value - The number to format.
         * @returns {string} Formatted number string.
         */
        const formatNumber = (value) => {
            if (value === null || value === undefined || value === "") return "-";
            const number = Number(value);
            if (isNaN(number)) return String(value);
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 7 }).format(number);
        };

        /**
         * Normalizes unit strings to human-friendly display format.
         * Converts abbreviations to proper symbols (e.g., "deg" to "°").
         * @param {string} unit - The unit string to normalize.
         * @param {string} value - The value to combine with the unit.
         * @returns {string} Formatted value with normalized unit.
         */
        const formatUnit = (unit, value) => {
            if (!unit) return value;
            const normalizedUnit = String(unit).trim().toLowerCase();

            const unitMappings = {
                'deg': '°',
                'degree': '°',
                '°': '°'
            };

            const displayUnit = unitMappings[normalizedUnit] || unit;
            return `${value}${displayUnit}`;
        };

        /**
         * Formats any waypoint property value, handling various data types.
         * Supports nested objects, arrays, numbers, strings, and special value/unit objects.
         * @param {*} value - The value to format.
         * @returns {string} Formatted display string.
         */
        const formatWaypointValue = (value) => {
            if (value === null || value === undefined || value === '') return '-';

            if (Array.isArray(value)) {
                if (value.length === 0) return '-';
                const formattedItems = value.map(formatWaypointValue).filter(item => item && item !== '-');
                return formattedItems.length > 0 ? formattedItems.join(', ') : '-';
            }

            if (typeof value === 'object') {
                // Handle value/unit objects (e.g., {value: 123, unit: "kg"})
                if (value.value !== undefined) {
                    const formattedValue = formatNumber(value.value);
                    return formatUnit(value.unit || value.units, formattedValue);
                }

                // Handle plain objects by flattening to key-value pairs
                const validEntries = Object.entries(value).filter(([key, val]) =>
                    val !== null && val !== undefined && val !== ''
                );

                if (validEntries.length === 0) return '-';
                if (validEntries.length === 1) {
                    return formatWaypointValue(validEntries[0][1]);
                }

                return validEntries.map(([key, val]) =>
                    `${key}: ${formatWaypointValue(val)}`
                ).join(', ');
            }

            if (typeof value === 'number') {
                return formatNumber(value);
            }

            if (typeof value === 'string') {
                // Try to parse as number if it looks numeric
                const numericValue = Number(value);
                if (!isNaN(numericValue) && value.trim().length > 0) {
                    return formatNumber(numericValue);
                }
                return value;
            }

            return String(value);
        };

        /**
         * Retrieves a nested value from an object using dot notation.
         * Handles special cases like coordinates and track values.
         * @param {Object} object - The object to extract value from.
         * @param {string} path - Dot-separated path to the value.
         * @returns {string} Formatted value string.
         */
        const getNestedValue = (object, path) => {
            let rawValue;

            if (path === 'coordinates') {
                // Special handling: combine latitude and longitude
                const latitude = object.latitude;
                const longitude = object.longitude;
                if (latitude !== undefined && longitude !== undefined) {
                    return `${formatWaypointValue(latitude)}, ${formatWaypointValue(longitude)}`;
                }
                return '-';
            } else if (path.startsWith('tracks.')) {
                // Special handling for track values
                rawValue = extractTrackValue(object, path);
            } else {
                // Standard nested property access
                rawValue = path.split('.').reduce((obj, key) =>
                    (obj ? obj[key] : undefined), object
                );
            }

            return formatWaypointValue(rawValue);
        };

        // ==========================================
        // BUSINESS LOGIC & DATA PROCESSING
        // ==========================================

        /**
         * Processes raw JSON flight data and extracts the main route information.
         * Parses the uploaded file content, validates the structure, and prepares
         * waypoint data for display by sorting them chronologically.
         *
         * @param {string} jsonText - The raw JSON string from the uploaded file.
         * @returns {Object} The processed main route data with sorted waypoints.
         * @throws {Error} If the JSON is invalid or missing required route structure.
         */
        const processFlightData = (jsonText) => {
            const parsedData = JSON.parse(jsonText);
            const routes = Array.isArray(parsedData) ? parsedData : [parsedData];

            if (routes.length === 0) {
                throw new Error("The file does not contain any routes.");
            }

            // Select the primary route (prefer ID 0) or fallback to first available
            const mainRoute = routes.find(route => route.id === 0) || routes[0];

            // Ensure waypoints exist and sort them by sequence for logical flight path
            if (mainRoute && Array.isArray(mainRoute.waypoints)) {
                mainRoute.waypoints.sort((waypointA, waypointB) =>
                    (waypointA.sequenceId || 0) - (waypointB.sequenceId || 0)
                );
            } else {
                // Provide fallback empty array to prevent rendering errors
                mainRoute.waypoints = [];
            }

            return mainRoute;
        };

        /**
         * Extracts routes.backup, flight.backup, and files listed in documents.backup from a ZIP-compatible archive.
         * @param {File} uploadedFile - User-selected archive file.
         * @returns {Promise<{routesBackupText: string, flightBackupText: string|null, crewMembersBackupText: string|null, documentsBackupText: string|null, documentFiles: Array<{name: string, extension: string, blob: Blob, textContent: string|null}>}>}
         * @throws {Error} If archive cannot be read or routes.backup is missing.
         */
        const readBackupFilesFromArchive = async (uploadedFile) => {
            if (!window.JSZip) {
                throw new Error("ZIP library failed to load. Please refresh and try again.");
            }

            let zipArchive;
            try {
                const archiveBuffer = await uploadedFile.arrayBuffer();
                zipArchive = await JSZip.loadAsync(archiveBuffer);
            } catch (archiveError) {
                throw new Error("Invalid archive file. Please upload a ZIP/.effarchive export.");
            }

            const routesEntry = zipArchive.file('routes.backup');
            if (!routesEntry) {
                throw new Error("The archive does not contain routes.backup.");
            }

            const flightEntry = zipArchive.file('flight.backup');
            const crewMembersEntry = zipArchive.file('crewMembers.backup');
            const documentsEntry = zipArchive.file('documents.backup');

            const [routesBackupText, flightBackupText, crewMembersBackupText, documentsBackupText] = await Promise.all([
                routesEntry.async('string'),
                flightEntry ? flightEntry.async('string') : Promise.resolve(null),
                crewMembersEntry ? crewMembersEntry.async('string') : Promise.resolve(null),
                documentsEntry ? documentsEntry.async('string') : Promise.resolve(null)
            ]);

            const getArchiveBaseName = (archivePath) => archivePath.split('/').pop() || archivePath;
            const archiveEntriesByBaseName = new Map(
                Object.values(zipArchive.files)
                    .filter((archiveEntry) => !archiveEntry.dir)
                    .map((archiveEntry) => [getArchiveBaseName(archiveEntry.name).toLowerCase(), archiveEntry])
            );
            const documentMetadata = processDocumentMetadata(documentsBackupText);
            const documentFiles = (await Promise.all(
                documentMetadata.map(async (documentItem) => {
                    const archiveEntry = archiveEntriesByBaseName.get(documentItem.filename.toLowerCase());
                    if (!archiveEntry) return null;

                    if (documentItem.extension === 'txt') {
                        const [textContent, originalBlob] = await Promise.all([
                            archiveEntry.async('string'),
                            archiveEntry.async('blob')
                        ]);
                        const textBlob = originalBlob.type === 'text/plain'
                            ? originalBlob
                            : new Blob([originalBlob], { type: 'text/plain' });

                        return {
                            name: documentItem.filename,
                            extension: documentItem.extension,
                            blob: textBlob,
                            textContent
                        };
                    }

                    const originalBlob = await archiveEntry.async('blob');
                    const mimeType = getDocumentMimeType(documentItem.extension);
                    const typedBlob = mimeType && originalBlob.type !== mimeType
                        ? new Blob([originalBlob], { type: mimeType })
                        : originalBlob;

                    return {
                        name: documentItem.filename,
                        extension: documentItem.extension,
                        blob: typedBlob,
                        textContent: null
                    };
                })
            )).filter(Boolean);

            return { routesBackupText, flightBackupText, crewMembersBackupText, documentsBackupText, documentFiles };
        };

        /**
         * Parses flight.backup JSON payload used for the Overview tab.
         * @param {string|null} jsonText - Raw JSON string from flight.backup.
         * @returns {Object|null} Parsed summary object or null when unavailable.
         */
        const processFlightSummaryData = (jsonText) => {
            if (!jsonText) return null;
            const parsedData = JSON.parse(jsonText);
            return parsedData && typeof parsedData === 'object' ? parsedData : null;
        };

        /**
         * Parses documents.backup and returns document entries in metadata order.
         * @param {string|null} jsonText - Raw JSON string from documents.backup.
         * @returns {Array<{filename: string, extension: string}>} Document metadata entries.
         */
        const processDocumentMetadata = (jsonText) => {
            if (!jsonText) return [];

            const parsedData = JSON.parse(jsonText);
            if (!Array.isArray(parsedData)) return [];

            return parsedData
                .map((documentItem) => {
                    if (!documentItem || typeof documentItem !== 'object') return null;

                    const filename = typeof documentItem.filename === 'string'
                        ? documentItem.filename.trim()
                        : '';
                    const extension = typeof documentItem.extension === 'string'
                        ? documentItem.extension.trim().toLowerCase()
                        : '';
                    const resolvedExtension = extension || getFileExtension(filename);

                    if (!filename) return null;

                    return {
                        filename,
                        extension: resolvedExtension
                    };
                })
                .filter(Boolean);
        };

        /**
         * Extracts a normalized file extension from a filename.
         * @param {string} fileName - File name including extension.
         * @returns {string} Lowercase extension without the dot.
         */
        const getFileExtension = (fileName) => {
            if (!fileName || typeof fileName !== 'string') return '';
            const extension = fileName.split('.').pop();
            return extension ? extension.trim().toLowerCase() : '';
        };

        /**
         * Maps a supported document extension to a browser MIME type.
         * @param {string} extension - Lowercase file extension.
         * @returns {string} MIME type for blob rendering.
         */
        const getDocumentMimeType = (extension) => {
            const mimeTypes = {
                pdf: 'application/pdf',
                txt: 'text/plain',
                gif: 'image/gif',
                jpg: 'image/jpeg',
                jpeg: 'image/jpeg',
                png: 'image/png',
                webp: 'image/webp'
            };

            return mimeTypes[extension] || 'application/octet-stream';
        };

        /**
         * Checks whether a document extension can be rendered as an image.
         * @param {string} extension - Lowercase file extension.
         * @returns {boolean} True when browser image rendering is supported.
         */
        const isImageDocument = (extension) => {
            return ['gif', 'jpg', 'jpeg', 'png', 'webp'].includes(extension);
        };

        /**
         * Converts an ISO-8601 duration (PTxHxMxS) to minutes.
         * @param {string} duration - ISO duration string.
         * @returns {number|null} Total minutes or null if invalid.
         */
        const parseDurationToMinutes = (duration) => {
            if (!duration || typeof duration !== 'string') return null;

            const durationMatch = duration.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
            if (!durationMatch) return null;

            const hours = Number(durationMatch[1] || 0);
            const minutes = Number(durationMatch[2] || 0);
            const seconds = Number(durationMatch[3] || 0);

            return hours * 60 + minutes + Math.round(seconds / 60);
        };

        /**
         * Sanitizes a limited HTML fragment from flight.backup while preserving
         * simple formatting such as line breaks, bold text, and bullet lists.
         * @param {string} htmlText - Raw HTML-like text from flight.backup.
         * @returns {string} Sanitized HTML safe for display.
         */
        const sanitizeRichText = (htmlText) => {
            if (!htmlText || typeof htmlText !== 'string') return '';

            const parser = new DOMParser();
            const documentFragment = parser.parseFromString(`<div>${htmlText}</div>`, 'text/html');
            const container = documentFragment.body.firstElementChild;

            if (!container) return '';

            const allowedTags = new Set(['B', 'STRONG', 'BR', 'UL', 'OL', 'LI', 'P']);

            const sanitizeNode = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    return document.createTextNode(node.textContent || '');
                }

                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return document.createDocumentFragment();
                }

                const tagName = node.tagName.toUpperCase();
                const sanitizedChildren = Array.from(node.childNodes).map(sanitizeNode);

                if (!allowedTags.has(tagName)) {
                    const fragment = document.createDocumentFragment();
                    sanitizedChildren.forEach((childNode) => fragment.appendChild(childNode));
                    return fragment;
                }

                const cleanElement = document.createElement(tagName.toLowerCase());
                sanitizedChildren.forEach((childNode) => cleanElement.appendChild(childNode));
                return cleanElement;
            };

            const safeWrapper = document.createElement('div');
            Array.from(container.childNodes)
                .map(sanitizeNode)
                .forEach((childNode) => safeWrapper.appendChild(childNode));

            return safeWrapper.innerHTML;
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        /**
         * Icon Component - Renders SVG icons from a predefined library.
         * Provides consistent iconography throughout the application.
         *
         * @param {Object} props - Component properties
         * @param {string} props.name - Name of the icon to render
         * @param {string} props.className - Additional CSS classes for styling
         */
        const Icon = ({ name, className = "" }) => {
            // Icon library with SVG path definitions
            const iconPaths = {
                plane: "M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z",
                upload: "M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-4-4l4 4 4-4",
                clock: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zm0-16v6l4 2",
                droplet: "M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5s-3 3.5-3 5.5a7 7 0 0 0 7 7z",
                settings: "M12.22 2h-.44a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2a2 2 0 0 1-2 2a2 2 0 0 0-2 2v.44a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2a2 2 0 0 1 2 2a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2a2 2 0 0 1 2-2a2 2 0 0 0 2-2v-.44a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2a2 2 0 0 1-2-2a2 2 0 0 0-2-2zM9 12a3 3 0 1 1 6 0a3 3 0 0 1-6 0z"
            };

            return h('svg', {
                width: 24,
                height: 24,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className
            }, h('path', { d: iconPaths[name] || "" }));
        };

        /**
         * WelcomeScreen Component - Initial screen shown when no flight data is loaded.
         * Provides file upload interface and displays any loading errors.
         *
         * @param {Object} props - Component properties
         * @param {Function} props.onFileSelected - Callback when user selects a file
         * @param {string|null} props.error - Error message to display, if any
         */
        const WelcomeScreen = ({ onFileSelected, error }) => {
            return h('div', {
                className: "min-h-screen flex flex-col items-center justify-center p-4 text-center"
            },
                h('div', { className: "bg-white p-6 sm:p-12 rounded-3xl sm:rounded-[3rem] shadow-xl animate-in w-full max-w-sm sm:max-w-md" },
                    h(Icon, { name: "upload", className: "w-12 h-12 sm:w-16 sm:h-16 text-blue-600 mx-auto mb-4 sm:mb-6" }),
                    h('h1', { className: "text-2xl sm:text-3xl font-black mb-3 sm:mb-4" }, "FlightLog Pro"),
                    h('p', { className: "text-gray-500 mb-6 sm:mb-8" }, "Upload a ZIP/.effarchive export containing routes.backup and flight.backup"),
                    h('label', {
                        className: "bg-blue-600 text-white px-6 py-3 sm:px-8 sm:py-4 rounded-2xl font-bold cursor-pointer hover:bg-blue-700 transition-all block"
                    },
                        "Choose File",
                        h('input', {
                            type: 'file',
                            className: "hidden",
                            onChange: onFileSelected
                        })
                    ),
                    error && h('p', {
                        className: "text-red-500 mt-4 text-sm font-medium"
                    }, error)
                )
            );
        };

        /**
         * RouteHeader Component - Displays route information and close action.
         * Shows destination airport details and top-level timing overview.
         *
         * @param {Object} props - Component properties
         * @param {Object} props.route - Route data object with airport information
         * @param {string|null} props.atcCallsign - ATC callsign from flight.backup
         * @param {string|null} props.flightNumber - Flight number from flight.backup
         * @param {string|null} props.originIcao - Origin ICAO code from flight.backup
         * @param {string|null} props.destinationIcao - Destination ICAO code from flight.backup
         * @param {string|null} props.ofpVersion - OFP version from flight.backup
         * @param {Object|null} props.scheduledTimes - Scheduled time data from flight.backup
         * @param {Function} props.onClose - Callback to close the current route
         */
        const RouteHeader = ({ route, atcCallsign, flightNumber, originIcao, destinationIcao, ofpVersion, scheduledTimes }) => {
            const headerTitle = `${flightNumber || 'N/A'} - ${ofpVersion || 'N/A'}`;
            const headerSubtitle = `${originIcao || 'N/A'} ${destinationIcao || 'N/A'}`;

            const formatDurationCompact = (isoDuration) => {
                const totalMinutes = parseDurationToMinutes(isoDuration);
                if (totalMinutes === null) return '-';

                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;

                if (hours === 0) return `${minutes} min`;
                return `${hours}h ${minutes}m`;
            };

            const topRowFields = [
                { label: 'Off Block', value: formatUtcTimeOnly(scheduledTimes?.offBlock) },
                { label: 'Taxi Out', value: scheduledTimes?.taxiOut !== undefined ? `${scheduledTimes.taxiOut} min` : '-' },
                { label: 'Take Off', value: formatUtcTimeOnly(scheduledTimes?.takeOffDate) }
            ];

            const bottomRowFields = [
                { label: 'Landing', value: formatUtcTimeOnly(scheduledTimes?.landingDate) },
                { label: 'Taxi In', value: scheduledTimes?.taxiIn !== undefined ? `${scheduledTimes.taxiIn} min` : '-' },
                { label: 'On Block', value: formatUtcTimeOnly(scheduledTimes?.onBlock) }
            ];

            const flightTimeValue = formatDurationCompact(scheduledTimes?.trip);

            return h('div', {
                className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm mb-4 sm:mb-8 flex flex-wrap justify-between items-center gap-4"
            },
                h('div', { className: "min-w-0" },
                    h('p', { className: "text-blue-600 text-[10px] font-bold uppercase tracking-widest" }, atcCallsign || "-"),
                    h('h2', { className: "text-xl sm:text-3xl font-black truncate" }, headerTitle),
                    h('div', { className: "flex flex-wrap items-center gap-2 text-gray-400 font-bold" },
                        h('span', { className: "uppercase tracking-wide" }, headerSubtitle)
                    ),
                    h('div', { className: "space-y-3 mt-3 sm:mt-4" },
                        h('div', { className: "grid grid-cols-3 gap-x-3 sm:gap-x-4" },
                            topRowFields.map((field) => h('div', { key: field.label, className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, field.label),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, field.value)
                            ))
                        ),
                        h('div', { className: "grid grid-cols-3 gap-x-3 sm:gap-x-4" },
                            bottomRowFields.map((field) => h('div', { key: field.label, className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, field.label),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, field.value)
                            ))
                        ),
                        h('div', { className: "grid grid-cols-1" },
                            h('div', { className: "min-w-0" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, "Flight Time"),
                                h('p', { className: "text-xs sm:text-sm font-bold text-gray-700 truncate" }, flightTimeValue)
                            )
                        )
                    )
                ),
            );
        };

        /**
         * WaypointDetailModal - Full-detail overlay for a single waypoint.
         * Shows Planned / Actual / Diff rows with interactive inputs, plus all STATIC_COLUMNS values.
         */
        const WaypointDetailModal = ({
            waypoint, onClose,
            actualData, setActualData, plannedTimeStr, fuelData,
            incrementTime, decrementTime,
            incrementFuelUsed, decrementFuelUsed,
            incrementFuelRemaining, decrementFuelRemaining,
            handleFuelUsedChange, handleFuelRemainingChange
        }) => {
            const handleBackdropClick = (e) => {
                if (e.target === e.currentTarget) onClose();
            };

            useEffect(() => {
                const handleKeyDown = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', handleKeyDown);
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, []);

            const allFields = STATIC_COLUMNS.map(col => ({
                label: col.label,
                value: getNestedValue(waypoint, col.path)
            })).filter(f => f.value && f.value !== '-');

            const getDiffColor = (diff) => {
                if (diff === 0) return "text-blue-500";
                return diff > 0 ? "text-red-500" : "text-emerald-500";
            };

            const plannedTimeMinutes = timeToMinutes(plannedTimeStr);
            const actualTimeMinutes = timeToMinutes(actualData.time);
            // EFB fuel check diffs — same Actual − Planned convention as WaypointCard.
            // These drive the diff row (4th column) in the Planned / Actual / Diff grid.
            const timeDiff = (plannedTimeMinutes !== null && actualTimeMinutes !== null)
                ? actualTimeMinutes - plannedTimeMinutes : null;

            // Positive = burned more than planned (adverse → red)
            const fuelUsedDiff = (fuelData?.numCumulated !== undefined && actualData.used !== "")
                ? Number(actualData.used) - fuelData.numCumulated : null;

            // Positive = more remaining than planned (beneficial → green, colour inverted below)
            const fuelRemainingDiff = (fuelData?.numRemaining !== undefined && actualData.remaining !== "")
                ? Number(actualData.remaining) - fuelData.numRemaining : null;

            return h('div', {
                className: "fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/40",
                onClick: (e) => {
                    e.stopPropagation();
                    handleBackdropClick(e);
                }
            },
                h('div', { className: "bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full sm:max-w-xl max-h-[90vh] overflow-y-auto animate-in" },
                    h('div', { className: "p-5 sm:p-6 pb-4 border-b border-gray-100 flex items-start justify-between gap-4 sticky top-0 bg-white rounded-t-3xl z-10" },
                        h('div', null,
                            h('p', { className: UI_STYLES.header }, "Waypoint"),
                            h('h2', { className: "text-xl sm:text-2xl font-black text-gray-800" }, waypoint.title || "Unnamed Fix")
                        ),
                        h('button', {
                            onClick: onClose,
                            className: "flex-shrink-0 w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 transition-colors flex items-center justify-center font-bold text-gray-500 hover:text-gray-700",
                            'aria-label': 'Close'
                        }, "✕")
                    ),
                    h('div', { className: "p-5 sm:p-6 space-y-5" },
                        h('div', { className: "grid grid-cols-[72px_1fr_minmax(120px,1.5fr)_52px] gap-x-3 gap-y-2 items-center" },
                            h('div', { key: "h0" }),
                            h('div', { key: "h1", className: UI_STYLES.header }, "Planned"),
                            h('div', { key: "h2", className: UI_STYLES.header }, "Actual"),
                            h('div', { key: "h3", className: UI_STYLES.header }, "Diff"),

                            h('div', { key: "t0", className: UI_STYLES.label }, "Time"),
                            h('div', { key: "t1", className: "text-sm font-bold text-gray-700" }, plannedTimeStr),
                            h('div', { key: "t2", className: "flex gap-0.5 items-center" },
                                h('input', {
                                    type: 'text',
                                    className: UI_STYLES.input,
                                    placeholder: "HH:MM",
                                    value: actualData.time,
                                    onChange: (e) => {
                                        const newValue = e.target.value;
                                        if (actualData.time === "" && newValue !== "") {
                                            setActualData(prev => ({ ...prev, time: plannedTimeStr.split('Z')[0] }));
                                        } else {
                                            setActualData(prev => ({ ...prev, time: newValue }));
                                        }
                                    }
                                }),
                                h('div', { className: "flex flex-row gap-0.5" },
                                    h('button', { onClick: decrementTime, className: UI_STYLES.button }, "▼"),
                                    h('button', { onClick: incrementTime, className: UI_STYLES.button }, "▲")
                                )
                            ),
                            h('div', { key: "t3", className: "font-bold text-[10px] " + getDiffColor(timeDiff) }, formatDiff(timeDiff, "min")),

                            ...(fuelData?.cumulated ? [
                                h('div', { key: "u0", className: UI_STYLES.label }, "Used"),
                                h('div', { key: "u1", className: "text-sm font-bold text-gray-700" }, fuelData.cumulated),
                                h('div', { key: "u2", className: "flex gap-0.5 items-center" },
                                    h('input', {
                                        type: 'number',
                                        className: UI_STYLES.input,
                                        placeholder: "Used",
                                        value: actualData.used,
                                        onChange: handleFuelUsedChange
                                    }),
                                    h('div', { className: "flex flex-row gap-0.5" },
                                        h('button', { onClick: decrementFuelUsed, className: UI_STYLES.button }, "▼"),
                                        h('button', { onClick: incrementFuelUsed, className: UI_STYLES.button }, "▲")
                                    )
                                ),
                                h('div', { key: "u3", className: "font-bold text-[10px] " + getDiffColor(fuelUsedDiff) }, formatDiff(fuelUsedDiff))
                            ] : []),

                            ...(fuelData?.remaining ? [
                                h('div', { key: "r0", className: UI_STYLES.label }, "Remaining"),
                                h('div', { key: "r1", className: "text-sm font-bold text-gray-700" }, fuelData.remaining),
                                h('div', { key: "r2", className: "flex gap-0.5 items-center" },
                                    h('input', {
                                        type: 'number',
                                        className: UI_STYLES.input,
                                        placeholder: "Rem",
                                        value: actualData.remaining,
                                        onChange: handleFuelRemainingChange
                                    }),
                                    h('div', { className: "flex flex-row gap-0.5" },
                                        h('button', { onClick: decrementFuelRemaining, className: UI_STYLES.button }, "▼"),
                                        h('button', { onClick: incrementFuelRemaining, className: UI_STYLES.button }, "▲")
                                    )
                                ),
                                h('div', { key: "r3", className: "font-bold text-[10px] " + getDiffColor(-fuelRemainingDiff) }, formatDiff(fuelRemainingDiff))
                            ] : [])
                        ),
                        allFields.length > 0 && h('div', null,
                            h('div', { className: "border-t border-gray-100 mb-4" }),
                            h('div', { className: "grid grid-cols-2 gap-x-6 gap-y-4" },
                                allFields.map(f => h('div', { key: f.label },
                                    h('p', { className: UI_STYLES.label }, f.label),
                                    h('p', { className: "text-sm font-bold text-gray-700 mt-0.5" }, f.value)
                                ))
                            )
                        )
                    )
                )
            );
        };

        /**
         * WaypointCard Component - Displays detailed information for a single flight waypoint.
         * Shows planned vs actual times, fuel consumption, and other flight parameters.
         * Includes interactive controls for entering actual flight data.
         *
         * @param {Object} props - Component properties
         * @param {Object} props.waypoint - Waypoint data object
         * @param {number} props.index - Position in the waypoint sequence
         * @param {Array<string>} props.selectedColumns - Additional columns to display
         */
        const WaypointCard = ({ waypoint, index, selectedColumns }) => {
            // Format planned data
            const plannedTimeStr = formatTime(waypoint.passingByDate);
            const fuelData = formatFuel(waypoint.fuel);

            // EFB Fuel Check: holds actual (in-flight) values entered by the pilot.
            // Empty strings mean "not yet entered" — diffs are only computed when a value is present.
            // This state is owned here in WaypointCard and passed down into WaypointDetailModal
            // so both the card and the modal stay in sync.
            const [actualData, setActualData] = useState({
                time: "",       // HH:MM actual passing time (UTC)
                used: "",       // Actual cumulative fuel used (same unit as planned)
                remaining: ""   // Actual fuel remaining on board (same unit as planned)
            });

            // Controls the full-detail modal
            const [showDetail, setShowDetail] = useState(false);

            // Track focus state for smart input behavior
            const [inputFocusState, setInputFocusState] = useState({
                usedFocused: false,
                remainingFocused: false
            });

            // ── EFB Fuel Check: diff = Actual − Planned ─────────────────────────────────
            // These three differences drive the inline annotations on the card (e.g. "+3 min",
            // "-100 KG") and the diff row inside WaypointDetailModal.
            //
            // Convention:  positive diff = deviation in the "bad" direction (late / overfuel used)
            //              negative diff = deviation in the "good" direction (early / fuel saved)
            //
            // Exception — fuel REMAINING: a positive diff (more fuel than planned) is good,
            // so the color is inverted when rendered (see renderPlannedWithDiff / getDifferenceColor).
            //
            // Diffs are null when the pilot has not yet entered an actual value, which suppresses
            // the annotation entirely so the card stays clean until data is available.
            const plannedTimeMinutes = timeToMinutes(plannedTimeStr);
            const actualTimeMinutes = timeToMinutes(actualData.time);
            const timeDifference = (plannedTimeMinutes !== null && actualTimeMinutes !== null)
                ? actualTimeMinutes - plannedTimeMinutes  // positive = late, negative = early
                : null;

            const fuelUsedDifference = (fuelData?.numCumulated !== undefined && actualData.used !== "")
                ? Number(actualData.used) - fuelData.numCumulated  // positive = more burned = adverse
                : null;

            const fuelRemainingDifference = (fuelData?.numRemaining !== undefined && actualData.remaining !== "")
                ? Number(actualData.remaining) - fuelData.numRemaining  // positive = more remaining = beneficial
                : null;

            // ==========================================
            // TIME INPUT HELPERS
            // ==========================================

            /**
             * Parses a time string into hours and minutes components.
             * @param {string} timeString - Time in HH:MM format
             * @returns {Object} Object with hours and minutes properties
             */
            const parseTimeComponents = (timeString) => {
                if (!timeString) return { hours: 0, minutes: 0 };
                const [hours, minutes] = timeString.split(':').map(Number);
                return {
                    hours: isNaN(hours) ? 0 : hours,
                    minutes: isNaN(minutes) ? 0 : minutes
                };
            };

            /**
             * Formats hours and minutes back into HH:MM string format.
             * @param {number} hours - Hours (0-23)
             * @param {number} minutes - Minutes (0-59)
             * @returns {string} Formatted time string
             */
            const formatTimeComponents = (hours, minutes) => {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            };

            /**
             * Increments the actual time by one minute.
             * Uses planned time as base if no actual time is set.
             */
            const incrementTime = () => {
                const baseTime = actualData.time || plannedTimeStr.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes + 1;
                let newHours = hours;

                if (newMinutes >= 60) {
                    newMinutes = 0;
                    newHours = (newHours + 1) % 24;
                }

                setActualData(prev => ({
                    ...prev,
                    time: formatTimeComponents(newHours, newMinutes)
                }));
            };

            /**
             * Decrements the actual time by one minute.
             * Uses planned time as base if no actual time is set.
             */
            const decrementTime = () => {
                const baseTime = actualData.time || plannedTimeStr.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes - 1;
                let newHours = hours;

                if (newMinutes < 0) {
                    newMinutes = 59;
                    newHours = (newHours - 1 + 24) % 24;
                }

                setActualData(prev => ({
                    ...prev,
                    time: formatTimeComponents(newHours, newMinutes)
                }));
            };

            // ==========================================
            // FUEL INPUT HELPERS (EFB Fuel Check)
            // ==========================================
            // Pilots verify fuel at each waypoint by comparing planned vs actual values.
            // These helpers handle the ▲/▼ stepper buttons and direct text-field edits.
            //
            // Smart first-tap behaviour: when a field is still empty, the first stepper press
            // initialises it to the nearest FUEL_STEP boundary around the planned value
            // (ceil for ▲, floor for ▼), so the pilot can adjust from a sensible baseline
            // rather than from zero.  Subsequent presses simply add/subtract FUEL_STEP.

            /**
             * Increments fuel used by the standard step amount.
             * On first use with empty field, rounds planned value up to next step boundary.
             */
            const incrementFuelUsed = () => {
                if (!actualData.used) {
                    // Initialize with rounded-up planned value
                    const plannedValue = fuelData.numCumulated;
                    const nextStepBoundary = Math.ceil(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, used: String(nextStepBoundary) }));
                } else {
                    // Increment existing value
                    const currentValue = Number(actualData.used);
                    setActualData(prev => ({ ...prev, used: String(currentValue + FUEL_STEP) }));
                }
            };

            /**
             * Decrements fuel used by the standard step amount.
             * On first use with empty field, rounds planned value down to previous step boundary.
             */
            const decrementFuelUsed = () => {
                if (!actualData.used) {
                    // Initialize with rounded-down planned value
                    const plannedValue = fuelData.numCumulated;
                    const prevStepBoundary = Math.floor(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({
                        ...prev,
                        used: String(Math.max(0, prevStepBoundary))
                    }));
                } else {
                    // Decrement existing value
                    const currentValue = Number(actualData.used);
                    setActualData(prev => ({
                        ...prev,
                        used: String(Math.max(0, currentValue - FUEL_STEP))
                    }));
                }
            };

            /**
             * Increments remaining fuel by the standard step amount.
             * On first use with empty field, rounds planned value up to next step boundary.
             */
            const incrementFuelRemaining = () => {
                if (!actualData.remaining) {
                    // Initialize with rounded-up planned value
                    const plannedValue = fuelData.numRemaining;
                    const nextStepBoundary = Math.ceil(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, remaining: String(nextStepBoundary) }));
                } else {
                    // Increment existing value
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({ ...prev, remaining: String(currentValue + FUEL_STEP) }));
                }
            };

            /**
             * Decrements remaining fuel by the standard step amount.
             * On first use with empty field, rounds planned value down to previous step boundary.
             */
            const decrementFuelRemaining = () => {
                if (!actualData.remaining) {
                    // Initialize with rounded-down planned value
                    const plannedValue = fuelData.numRemaining;
                    const prevStepBoundary = Math.floor(plannedValue / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({
                        ...prev,
                        remaining: String(Math.max(0, prevStepBoundary))
                    }));
                } else {
                    // Decrement existing value
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({
                        ...prev,
                        remaining: String(Math.max(0, currentValue - FUEL_STEP))
                    }));
                }
            };

            // ==========================================
            // INPUT CHANGE HANDLERS
            // ==========================================

            /**
             * Handles changes to the fuel used input field.
             * Provides smart initialization on first input.
             */
            const handleFuelUsedChange = (event) => {
                const newValue = event.target.value;
                if (actualData.used === "" && newValue !== "") {
                    // Pre-fill with planned value on first input
                    setActualData(prev => ({ ...prev, used: String(fuelData.numCumulated) }));
                } else {
                    setActualData(prev => ({ ...prev, used: newValue }));
                }
            };

            /**
             * Handles changes to the fuel remaining input field.
             * Provides smart initialization on first input.
             */
            const handleFuelRemainingChange = (event) => {
                const newValue = event.target.value;
                if (actualData.remaining === "" && newValue !== "") {
                    // Pre-fill with planned value on first input
                    setActualData(prev => ({ ...prev, remaining: String(fuelData.numRemaining) }));
                } else {
                    setActualData(prev => ({ ...prev, remaining: newValue }));
                }
            };

            // ==========================================
            // STYLING HELPERS
            // ==========================================

            /**
             * Determines color styling for difference values based on whether they're positive, negative, or zero.
             * @param {number} difference - The difference value to style
             * @returns {string} CSS class for coloring the difference
             */
            /**
             * Maps a diff value to a Tailwind text colour for the EFB fuel check display.
             *   positive → red   (adverse: late, burned more than planned)
             *   negative → green (beneficial: early, saved fuel)
             *   zero     → blue  (exactly on plan)
             *
             * For fuel REMAINING the sign semantics are reversed (more remaining is good),
             * so callers must negate: getDifferenceColor(-fuelRemainingDifference).
             */
            const getDifferenceColor = (difference) => {
                if (difference === 0) return "text-blue-500";
                return difference > 0 ? "text-red-500" : "text-emerald-500";
            };

            /**
             * Renders a planned value with an inline colour-coded diff annotation,
             * e.g. "44212 KG (+100 KG)" in red, or "10:40Z (-2 min)" in green.
             * Used on the OFP card so pilots can see deviations at a glance without
             * opening the detail modal.
             *
             * @param {string} plannedValue - Formatted planned value to display
             * @param {number|null} difference - Actual − Planned; null hides the annotation
             * @param {string} unit - Optional unit suffix for the diff label
             * @param {boolean} invertDiffColor - Pass true for fuel remaining, where a
             *   positive diff is beneficial (more fuel on board than planned)
             */
            const renderPlannedWithDiff = (plannedValue, difference, unit = "", invertDiffColor = false) => {
                if (difference === null || difference === undefined || isNaN(difference)) {
                    return plannedValue;
                }

                const colorTarget = invertDiffColor ? -difference : difference;
                return h('span', null,
                    plannedValue,
                    h('span', {
                        className: "font-bold text-[10px] " + getDifferenceColor(colorTarget)
                    }, ` (${formatDiff(difference, unit)})`)
                );
            };

            // Calculate grid layout based on selected columns
            const baseColumnCount = 3; // Time + Used + Remaining
            const extraColumnCount = selectedColumns?.length || 0;
            const gridColumnTemplate = `grid-cols-[100px_100px_100px${'_100px'.repeat(extraColumnCount)}]`;

            // ==========================================
            // RENDER COMPONENT
            // ==========================================

            return h('div', {
                className: "bg-white p-3 sm:p-6 rounded-3xl shadow-sm flex items-start gap-3 sm:gap-6 cursor-pointer",
                onClick: () => setShowDetail(true)
            },
                // Waypoint index (hidden for now)
                h('div', { className: "hidden w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center font-black text-gray-300 mt-1" }, index + 1),

                // Main content area
                h('div', { className: "flex-1 overflow-x-auto -mx-3 sm:mx-0 px-3 sm:px-0" },
                    // Waypoint title (click to open detail modal)
                    h('div', {
                        className: "font-black text-base sm:text-xl text-gray-800 mb-2 truncate hover:text-blue-600 transition-colors",
                        title: "Tap for full details"
                    }, waypoint.title || "Unnamed Fix"),
                    showDetail && h(WaypointDetailModal, {
                        waypoint,
                        onClose: () => setShowDetail(false),
                        actualData,
                        setActualData,
                        plannedTimeStr,
                        fuelData,
                        incrementTime,
                        decrementTime,
                        incrementFuelUsed,
                        decrementFuelUsed,
                        incrementFuelRemaining,
                        decrementFuelRemaining,
                        handleFuelUsedChange,
                        handleFuelRemainingChange
                    }),


                    // Data grid
                    h('div', { className: `grid ${gridColumnTemplate} gap-x-6 gap-y-0 min-w-max` },

                        // Header Row
                        h('div', { className: "contents" },
                            h('div', { className: UI_STYLES.header }, "Time"),
                            fuelData?.cumulated && h('div', { className: UI_STYLES.header }, "Used"),
                            fuelData?.remaining && h('div', { className: UI_STYLES.header }, "Remaining"),
                            selectedColumns.map(col => h('div', {
                                key: col,
                                className: UI_STYLES.header
                            }, getColumnLabel(col)))
                        ),

                        // Value Row (planned values with inline diff when actual exists)
                        h('div', { className: "contents" },
                            h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.value },
                                renderPlannedWithDiff(plannedTimeStr, timeDifference, "min")
                            ),
                            fuelData?.cumulated && h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.value },
                                renderPlannedWithDiff(fuelData.cumulated, fuelUsedDifference)
                            ),
                            fuelData?.remaining && h('div', { className: UI_STYLES.rowHeight + " " + UI_STYLES.value },
                                renderPlannedWithDiff(fuelData.remaining, fuelRemainingDifference, "", true)
                            ),
                            selectedColumns.map(col => h('div', {
                                key: col,
                                className: UI_STYLES.rowHeight + " " + UI_STYLES.value
                            }, getNestedValue(waypoint, col) || "-"))
                        )
                    )
                )
            );
        };

        /**
         * OFF BLOCK detail modal with only Time and Remaining editable controls.
         */
        const OffBlockDetailModal = ({
            title,
            plannedTime,
            plannedRemainingNumber,
            plannedRemainingDisplay,
            remainingUnit,
            actualData,
            setActualData,
            onClose,
            incrementTime,
            decrementTime,
            incrementRemaining,
            decrementRemaining,
            timeDifference,
            remainingDifference
        }) => {
            const handleBackdropClick = (e) => {
                if (e.target === e.currentTarget) onClose();
            };

        /**
         * OFF BLOCK section shown above the OFP waypoint list.
         * Uses the waypoint card layout for the inner flight-origin card.
         *
         * @param {Object} props - Component properties
         * @param {Object|null} props.summary - Parsed flight.backup object
         */
        const OffBlockSection = ({ summary }) => {
            const plannedTime = formatUtcTimeOnly(summary?.scheduledTimes?.offBlock);
            const blockFuelEntry = Array.isArray(summary?.plannedFuels)
                ? summary.plannedFuels.find((fuelEntry) => fuelEntry?.uid === 'blockFuel')
                : null;
            const plannedRemainingNumber = blockFuelEntry?.fuel?.amount;
            const remainingUnit = String(blockFuelEntry?.fuel?.unit || '').toUpperCase();
            const plannedRemainingDisplay = plannedRemainingNumber !== undefined
                ? `${formatNumber(plannedRemainingNumber)} ${remainingUnit}`.trim()
                : '-';
            const originTitle = summary?.originAirport?.icaoCode || '-';

            const [showDetail, setShowDetail] = useState(false);
            const [actualData, setActualData] = useState({
                time: "",
                remaining: ""
            });

            const parseTimeComponents = (timeString) => {
                if (!timeString) return { hours: 0, minutes: 0 };
                const [hours, minutes] = timeString.split(':').map(Number);
                return {
                    hours: isNaN(hours) ? 0 : hours,
                    minutes: isNaN(minutes) ? 0 : minutes
                };
            };

            const formatTimeComponents = (hours, minutes) => `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;

            const incrementTime = () => {
                const baseTime = actualData.time || plannedTime.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes + 1;
                let newHours = hours;

                if (newMinutes >= 60) {
                    newMinutes = 0;
                    newHours = (newHours + 1) % 24;
                }

                setActualData(prev => ({ ...prev, time: formatTimeComponents(newHours, newMinutes) }));
            };

            const decrementTime = () => {
                const baseTime = actualData.time || plannedTime.split('Z')[0];
                const { hours, minutes } = parseTimeComponents(baseTime);

                let newMinutes = minutes - 1;
                let newHours = hours;

                if (newMinutes < 0) {
                    newMinutes = 59;
                    newHours = (newHours - 1 + 24) % 24;
                }

                setActualData(prev => ({ ...prev, time: formatTimeComponents(newHours, newMinutes) }));
            };

            const incrementRemaining = () => {
                if (plannedRemainingNumber === undefined) return;

                if (!actualData.remaining) {
                    const nextStepBoundary = Math.ceil(plannedRemainingNumber / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, remaining: String(nextStepBoundary) }));
                } else {
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({ ...prev, remaining: String(currentValue + FUEL_STEP) }));
                }
            };

            const decrementRemaining = () => {
                if (plannedRemainingNumber === undefined) return;

                if (!actualData.remaining) {
                    const prevStepBoundary = Math.floor(plannedRemainingNumber / FUEL_STEP) * FUEL_STEP;
                    setActualData(prev => ({ ...prev, remaining: String(Math.max(0, prevStepBoundary)) }));
                } else {
                    const currentValue = Number(actualData.remaining);
                    setActualData(prev => ({ ...prev, remaining: String(Math.max(0, currentValue - FUEL_STEP)) }));
                }
            };

            const timeDifference = (() => {
                const plannedMinutes = timeToMinutes(plannedTime);
                const actualMinutes = timeToMinutes(actualData.time);
                if (plannedMinutes === null || actualMinutes === null) return null;
                return actualMinutes - plannedMinutes;
            })();

            const remainingDifference = (plannedRemainingNumber !== undefined && actualData.remaining !== "")
                ? Number(actualData.remaining) - plannedRemainingNumber
                : null;

            const getDifferenceColor = (difference) => {
                if (difference === 0) return "text-blue-500";
                return difference > 0 ? "text-red-500" : "text-emerald-500";
            };

            const renderPlannedWithDiff = (plannedValue, difference, unit = "", invertDiffColor = false) => {
                if (difference === null || difference === undefined || isNaN(difference)) {
                    return plannedValue;
                }

                const colorTarget = invertDiffColor ? -difference : difference;
                return h('span', null,
                    plannedValue,
                    h('span', { className: "font-bold text-[10px] " + getDifferenceColor(colorTarget) }, ` (${formatDiff(difference, unit)})`)
                );
            };

            return h('div', { className: "rounded-[2rem] border border-sky-100 bg-gradient-to-br from-sky-50 via-cyan-50 to-white p-3 sm:p-5 shadow-sm space-y-3" },
                h('div', { className: "px-1 flex items-center justify-between gap-3" },
                    h('div', null,
                        h('p', { className: "text-[10px] uppercase font-bold tracking-[0.22em] text-sky-600 mb-1" }, 'OFF BLOCK')
                    ),
                    h('div', { className: "text-[10px] uppercase font-bold tracking-widest text-sky-500 whitespace-nowrap" }, 'Tap on waypoint cards')
                ),
                h('div', {
                    className: "bg-white/90 ring-1 ring-sky-200 p-3 sm:p-6 rounded-3xl shadow-[0_10px_30px_rgba(14,116,144,0.10)] flex items-start gap-3 sm:gap-6 cursor-pointer",
                    onClick: () => setShowDetail(true)
                },
                    h('div', { className: "flex-1 overflow-x-auto -mx-3 sm:mx-0 px-3 sm:px-0" },
                        h('div', { className: "flex items-center justify-between gap-3 mb-3" },
                            h('div', { className: "font-black text-base sm:text-xl text-gray-800 truncate" }, originTitle)
                        ),
                        h('div', { className: "grid grid-cols-[130px_160px] gap-x-6 gap-y-0 min-w-max" },
                            h('div', { className: "contents" },
                                h('div', { className: "text-[10px] uppercase font-bold text-sky-500 tracking-wider mb-1" }, 'Time'),
                                h('div', { className: "text-[10px] uppercase font-bold text-sky-500 tracking-wider mb-1" }, 'Remaining')
                            ),
                            h('div', { className: "contents" },
                                h('div', { className: UI_STYLES.rowHeight + " text-sm font-black text-sky-950" },
                                    renderPlannedWithDiff(plannedTime, timeDifference, "min")
                                ),
                                h('div', { className: UI_STYLES.rowHeight + " text-sm font-black text-sky-950" },
                                    renderPlannedWithDiff(plannedRemainingDisplay, remainingDifference, remainingUnit, true)
                                )
                            )
                        )
                    )
                ),
                showDetail && h(OffBlockDetailModal, {
                    title: originTitle,
                    plannedTime,
                    plannedRemainingNumber,
                    plannedRemainingDisplay,
                    remainingUnit,
                    actualData,
                    setActualData,
                    onClose: () => setShowDetail(false),
                    incrementTime,
                    decrementTime,
                    incrementRemaining,
                    decrementRemaining,
                    timeDifference,
                    remainingDifference
                })
            );
        };
