        /**
         * PdfViewer - Renders a single PDF using PDF.js onto a series of canvases.
         * Supports all pages on all platforms including iOS Safari.
         *
         * @param {Object} props
         * @param {string} props.url - Object URL of the PDF blob
         */
        const PdfViewer = ({ url }) => {
            const [pages, setPages] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);
            const renderRefs = useRef([]);
            const renderTasks = useRef([]);

            useEffect(() => {
                if (!url) return;

                setIsLoading(true);
                setLoadError(null);
                setPages([]);
                renderRefs.current = [];
                // Cancel any outstanding render tasks from previous document
                renderTasks.current.forEach((task) => { try { task.cancel(); } catch (_) {} });
                renderTasks.current = [];

                const lib = window.pdfjsLib;
                if (!lib) {
                    setLoadError('PDF.js failed to load. Please refresh the page.');
                    setIsLoading(false);
                    return;
                }

                // Configure worker lazily (only once)
                if (!lib.GlobalWorkerOptions.workerSrc) {
                    lib.GlobalWorkerOptions.workerSrc =
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                }

                lib.getDocument(url).promise
                    .then((pdfDoc) => {
                        const pageNumbers = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
                        setPages(pageNumbers);
                        setIsLoading(false);

                        // Render each page after the canvases are mounted
                        // Use a small delay to let React commit the canvas elements
                        setTimeout(() => {
                            pageNumbers.forEach((pageNum, idx) => {
                                pdfDoc.getPage(pageNum).then((page) => {
                                    const canvas = renderRefs.current[idx];
                                    if (!canvas) return;

                                    const containerWidth = canvas.parentElement
                                        ? canvas.parentElement.clientWidth || 800
                                        : 800;
                                    const devicePixelRatio = window.devicePixelRatio || 1;
                                    const baseViewport = page.getViewport({ scale: 1 });
                                    const cssScale = containerWidth / baseViewport.width;
                                    const renderScale = cssScale * devicePixelRatio;
                                    const viewport = page.getViewport({ scale: renderScale });

                                    // Physical canvas size matches device pixels for sharp rendering
                                    canvas.width = viewport.width;
                                    canvas.height = viewport.height;
                                    // CSS size stays at logical pixels so layout is unchanged
                                    canvas.style.width = `${viewport.width / devicePixelRatio}px`;
                                    canvas.style.height = `${viewport.height / devicePixelRatio}px`;

                                    const task = page.render({
                                        canvasContext: canvas.getContext('2d'),
                                        viewport
                                    });
                                    renderTasks.current[idx] = task;
                                    task.promise.catch(() => {});
                                });
                            });
                        }, 50);
                    })
                    .catch((err) => {
                        setLoadError('Could not load PDF: ' + (err.message || 'unknown error'));
                        setIsLoading(false);
                    });
            }, [url]);

            if (isLoading) {
                return h('div', { className: "flex items-center justify-center h-64 text-gray-400 font-bold text-sm" }, 'Loading PDF…');
            }
            if (loadError) {
                return h('div', { className: "flex items-center justify-center h-32 text-red-500 font-bold text-sm p-4 text-center" }, loadError);
            }

            return h('div', { className: "flex flex-col gap-2" },
                pages.map((pageNum, idx) =>
                    h('canvas', {
                        key: pageNum,
                        ref: (el) => { renderRefs.current[idx] = el; },
                        className: "w-full rounded-xl shadow-sm bg-white"
                    })
                )
            );
        };

        /**
         * DocumentViewer - Renders a single document based on its file type.
         * Supports PDF, text, and common image formats.
         *
         * @param {Object} props
         * @param {{name: string, extension: string, url: string, textContent: string|null}} props.documentItem
         */
        const DocumentViewer = ({ documentItem }) => {
            if (!documentItem) {
                return h('div', { className: "flex items-center justify-center h-32 text-gray-400 font-bold text-sm" }, 'No document selected.');
            }

            if (documentItem.extension === 'pdf') {
                return h(PdfViewer, { url: documentItem.url });
            }

            if (documentItem.extension === 'txt') {
                return h('pre', {
                    className: "whitespace-pre-wrap break-words text-xs sm:text-sm leading-relaxed text-gray-700 bg-gray-50 rounded-2xl p-4 overflow-x-auto font-mono"
                }, documentItem.textContent || 'This text file is empty.');
            }

            if (isImageDocument(documentItem.extension)) {
                return h('div', { className: "bg-gray-50 rounded-2xl p-2 sm:p-4" },
                    h('img', {
                        src: documentItem.url,
                        alt: documentItem.name,
                        className: "w-full h-auto rounded-xl mx-auto"
                    })
                );
            }

            return h('div', { className: "text-center py-10 text-gray-500" },
                h('p', { className: "font-bold mb-2" }, 'Preview not available for this file type.'),
                h('a', {
                    href: documentItem.url,
                    target: '_blank',
                    rel: 'noreferrer',
                    className: "inline-flex items-center px-4 py-2 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition"
                }, 'Open File')
            );
        };

        /**
         * DocumentsPage - Displays documents extracted from documents.backup.
         * Renders a selectable list and a type-aware viewer.
         *
         * @param {Object} props - Component properties
         * @param {Array<{name: string, extension: string, url: string, textContent: string|null}>} props.documents - Extracted documents
         * @param {number} props.selectedDocumentIndex - Currently selected document index
         * @param {Function} props.onSelectDocument - Callback to switch selected document
         */
        const DocumentsPage = ({ documents, selectedDocumentIndex, onSelectDocument }) => {
            const [isListExpanded, setIsListExpanded] = useState(false);

            if (!documents || documents.length === 0) {
                return h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm text-center text-gray-500" },
                    h('h3', { className: "text-lg font-bold mb-2" }, "Documents"),
                    h('p', null, "No files from documents.backup were found in this archive.")
                );
            }

            const safeIndex = Math.min(Math.max(selectedDocumentIndex || 0, 0), documents.length - 1);
            const activeDocument = documents[safeIndex];
            
            // Group documents by file type and sort by name within groups
            const groupedDocuments = documents.reduce((acc, doc, index) => {
                const extension = doc.extension || 'other';
                if (!acc[extension]) {
                    acc[extension] = [];
                }
                acc[extension].push({ doc, index });
                return acc;
            }, {});

            // Sort groups by extension name, and sort documents within each group by name
            const sortedGroups = Object.entries(groupedDocuments)
                .sort(([extA], [extB]) => extA.localeCompare(extB))
                .map(([ext, items]) => [ext, items.sort((a, b) => a.doc.name.localeCompare(b.doc.name))]);

            // Create a flat array of sorted indices for navigation
            const sortedIndices = sortedGroups.flatMap(([_, items]) => items.map(({ index }) => index));

            // Find current position in the sorted order
            const currentSortedPosition = sortedIndices.indexOf(safeIndex);
            const isFirstInSortedOrder = currentSortedPosition === 0;
            const isLastInSortedOrder = currentSortedPosition === sortedIndices.length - 1;

            const handleSelectDocument = (targetIndex) => {
                const clampedIndex = Math.min(Math.max(targetIndex, 0), documents.length - 1);
                if (clampedIndex === safeIndex) return;
                onSelectDocument(clampedIndex);
            };

            const handleNavigateNext = () => {
                if (currentSortedPosition < sortedIndices.length - 1) {
                    onSelectDocument(sortedIndices[currentSortedPosition + 1]);
                }
            };

            const handleNavigatePrev = () => {
                if (currentSortedPosition > 0) {
                    onSelectDocument(sortedIndices[currentSortedPosition - 1]);
                }
            };



            return h('div', { className: "space-y-4" },
                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('button', {
                        type: 'button',
                        onClick: () => setIsListExpanded(!isListExpanded),
                        className: "w-full flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg transition"
                    },
                        h('h3', { className: "text-sm font-bold text-gray-800" }, `All Documents (${documents.length})`),
                        h('span', { className: `text-gray-400 text-lg transition-transform ${isListExpanded ? 'rotate-180' : ''}` }, '▼')
                    ),
                    isListExpanded && h('div', { className: "mt-3 pt-3 border-t border-gray-100 space-y-4" },
                        sortedGroups.map(([extension, items]) =>
                            h('div', { key: extension },
                                h('h4', { className: "text-xs uppercase font-bold text-gray-400 tracking-wider mb-2" }, extension.toUpperCase()),
                                h('div', { className: "flex flex-wrap gap-2" },
                                    items.map(({ doc, index }) =>
                                        h('button', {
                                            key: `${doc.name}-${index}`,
                                            type: 'button',
                                            onClick: () => handleSelectDocument(index),
                                            className: `px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${index === safeIndex ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`,
                                            title: doc.name
                                        }, doc.name)
                                    )
                                )
                            )
                        )
                    )
                ),
                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('h3', { className: "text-sm sm:text-base font-bold text-gray-800 mb-4 break-words" }, activeDocument.name),
                    h('div', { className: "flex items-center gap-2 mb-4" },
                        h('button', {
                            type: 'button',
                            onClick: handleNavigatePrev,
                            disabled: isFirstInSortedOrder,
                            className: `h-12 w-12 sm:h-9 sm:w-9 rounded-full text-xl sm:text-lg font-black transition ${isFirstInSortedOrder ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                            title: 'Previous document',
                            'aria-label': 'Previous document'
                        }, '←'),
                        h('button', {
                            type: 'button',
                            onClick: handleNavigateNext,
                            disabled: isLastInSortedOrder,
                            className: `h-12 w-12 sm:h-9 sm:w-9 rounded-full text-xl sm:text-lg font-black transition ${isLastInSortedOrder ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                            title: 'Next document',
                            'aria-label': 'Next document'
                        }, '→'),
                        h('a', {
                            href: activeDocument.url,
                            download: activeDocument.name,
                            className: "h-9 px-3 rounded-full text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition inline-flex items-center",
                            title: 'Download document',
                            'aria-label': 'Download document'
                        }, 'Download')
                    ),
                    h(DocumentViewer, { documentItem: activeDocument })
                )
            );
        };

        /**
         * Renders NOTAM text with keyword-based colors from notamKeywords.backup.
         * @param {string} text - Raw NOTAM text.
         * @param {Array<{keyword: string, colorHex: string}>} keywordPalette - NOTAM keyword color definitions.
         * @returns {Array<React.ReactNode>|string} React fragments for highlighted text.
         */
        const renderHighlightedNotamText = (text, keywordPalette) => {
            if (!text) return '-';
            if (!Array.isArray(keywordPalette) || keywordPalette.length === 0) return text;

            const dedupedKeywords = [];
            const keywordColorByUpper = new Map();

            keywordPalette.forEach((keywordEntry) => {
                if (!keywordEntry || !keywordEntry.keyword || !keywordEntry.colorHex) return;

                const upperKeyword = keywordEntry.keyword.toUpperCase();
                if (!keywordColorByUpper.has(upperKeyword)) {
                    keywordColorByUpper.set(upperKeyword, keywordEntry.colorHex);
                    dedupedKeywords.push(keywordEntry.keyword);
                }
            });

            if (dedupedKeywords.length === 0) return text;

            const escapedKeywords = dedupedKeywords
                .slice()
                .sort((keywordA, keywordB) => keywordB.length - keywordA.length)
                .map((keyword) => escapeRegExp(keyword));

            const keywordRegex = new RegExp(`(${escapedKeywords.join('|')})`, 'gi');
            const textSegments = String(text).split(keywordRegex);

            return textSegments.map((segment, segmentIndex) => {
                const upperSegment = segment.toUpperCase();
                const segmentColor = keywordColorByUpper.get(upperSegment);

                if (!segmentColor) {
                    return segment;
                }

                return h('span', {
                    key: `kw-${segmentIndex}`,
                    className: "font-bold",
                    style: { color: segmentColor }
                }, segment);
            });
        };

        /**
         * StationsPage - Displays NOTAMs grouped by station and highlights key words.
         * @param {Object} props - Component properties
         * @param {Array<Object>} props.notams - Parsed notams.backup entries
         * @param {Array<{keyword: string, colorHex: string}>} props.keywordPalette - Parsed notamKeywords.backup entries
         */
        const StationsPage = ({ notams, keywordPalette }) => {
            const [selectedTraversalIndex, setSelectedTraversalIndex] = useState(0);
            const [priorityFilter, setPriorityFilter] = useState('all');

            if (!Array.isArray(notams) || notams.length === 0) {
                return h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm text-center text-gray-500" },
                    h('h3', { className: "text-lg font-bold mb-2" }, "Stations"),
                    h('p', null, "No notams.backup data found in this archive.")
                );
            }

            const stationMap = new Map();
            const stationRolesMap = new Map();

            const normalizeStationRole = (notamEntry) => {
                const rawRole = String(notamEntry?.function?.value || notamEntry?.initialFunction || 'other').trim().toLowerCase();

                const roleBySource = {
                    departure: 'departure',
                    destination: 'destination',
                    destinationalternate: 'alternate',
                    etops: 'etops',
                    enroute: 'enroute',
                    fir: 'fir',
                    other: 'other'
                };

                return roleBySource[rawRole] || 'other';
            };

            const stationRoleLabels = {
                departure: 'Departure',
                destination: 'Destination',
                alternate: 'Alternate',
                etops: 'ETOPS',
                enroute: 'Enroute',
                fir: 'FIR/UIR',
                other: 'Other'
            };

            notams.forEach((notamEntry, index) => {
                const stationCode = String(notamEntry?.icaoCode || notamEntry?.issuer || 'OTHER').trim().toUpperCase() || 'OTHER';
                const stationName = String(notamEntry?.name || '').trim();
                const stationRole = normalizeStationRole(notamEntry);

                if (!stationMap.has(stationCode)) {
                    stationMap.set(stationCode, {
                        code: stationCode,
                        name: stationName,
                        items: []
                    });
                }

                const stationEntry = stationMap.get(stationCode);
                if (!stationEntry.name && stationName) {
                    stationEntry.name = stationName;
                }

                if (!stationRolesMap.has(stationCode)) {
                    stationRolesMap.set(stationCode, new Set());
                }
                stationRolesMap.get(stationCode).add(stationRole);

                stationEntry.items.push({
                    ...notamEntry,
                    _index: index
                });
            });

            const stationGroups = Array.from(stationMap.values())
                .sort((stationA, stationB) => stationA.code.localeCompare(stationB.code));

            const roleOrder = ['departure', 'destination', 'alternate', 'etops', 'enroute', 'fir', 'other'];
            const stationPrimaryRoleMap = new Map(
                stationGroups.map((stationEntry) => {
                    const stationRoles = stationRolesMap.get(stationEntry.code);
                    const primaryRole = roleOrder.find((roleKey) => stationRoles?.has(roleKey)) || 'other';
                    return [stationEntry.code, primaryRole];
                })
            );

            const stationsByRole = roleOrder
                .map((roleKey) => {
                    const stationsForRole = stationGroups
                        .filter((stationEntry) => stationPrimaryRoleMap.get(stationEntry.code) === roleKey);

                    return {
                        roleKey,
                        roleLabel: stationRoleLabels[roleKey],
                        stations: stationsForRole
                    };
                })
                .filter((roleEntry) => roleEntry.stations.length > 0);

            const groupedTraversal = stationsByRole.flatMap((roleEntry) =>
                roleEntry.stations.map((stationEntry) => ({
                    roleKey: roleEntry.roleKey,
                    stationCode: stationEntry.code
                }))
            );

            const traversalIndexByRoleAndCode = new Map(
                groupedTraversal.map((traversalEntry, traversalIndex) => [
                    `${traversalEntry.roleKey}::${traversalEntry.stationCode}`,
                    traversalIndex
                ])
            );

            useEffect(() => {
                setSelectedTraversalIndex((previousIndex) => {
                    if (groupedTraversal.length === 0) return 0;
                    return Math.min(previousIndex, groupedTraversal.length - 1);
                });
            }, [groupedTraversal.length]);

            const safeTraversalIndex = Math.min(Math.max(selectedTraversalIndex, 0), groupedTraversal.length - 1);
            const activeTraversalEntry = groupedTraversal[safeTraversalIndex];
            const activeStation = stationMap.get(activeTraversalEntry.stationCode);
            const activeStationRoles = roleOrder
                .filter((roleKey) => stationRolesMap.get(activeStation.code)?.has(roleKey))
                .map((roleKey) => stationRoleLabels[roleKey]);

            const sortedStationNotams = activeStation.items.slice().sort((notamA, notamB) => {
                const timeA = Date.parse(notamA.startDate || '') || 0;
                const timeB = Date.parse(notamB.startDate || '') || 0;
                if (timeA !== timeB) return timeB - timeA;
                return (notamA.sequenceId || 0) - (notamB.sequenceId || 0);
            });

            const normalizePriority = (priorityValue) => String(priorityValue || '').trim().toLowerCase();
            const priorityLevels = ['low', 'medium', 'high'];

            const notamsByLevel = {
                low: sortedStationNotams.filter((notamEntry) => normalizePriority(notamEntry.priority) === 'low'),
                medium: sortedStationNotams.filter((notamEntry) => normalizePriority(notamEntry.priority) === 'medium'),
                high: sortedStationNotams.filter((notamEntry) => normalizePriority(notamEntry.priority) === 'high')
            };

            const visibleNotams = priorityFilter === 'all'
                ? sortedStationNotams
                : notamsByLevel[priorityFilter] || [];

            const showPreviousStation = () => {
                if (safeTraversalIndex <= 0) return;
                setSelectedTraversalIndex(safeTraversalIndex - 1);
            };

            const showNextStation = () => {
                if (safeTraversalIndex >= groupedTraversal.length - 1) return;
                setSelectedTraversalIndex(safeTraversalIndex + 1);
            };

            return h('div', { className: "space-y-4 sm:space-y-6" },
                h('div', { className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('div', { className: "flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3" },
                        h('h3', { className: "text-base sm:text-xl font-black text-gray-800" }, "Stations NOTAMs"),
                        h('div', { className: "flex flex-wrap items-center gap-2" },
                            h('span', { className: "px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700 tracking-wide" }, `${stationGroups.length} Stations`),
                            h('span', { className: "px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-700 tracking-wide" }, `${notams.length} NOTAMs`)
                        )
                    ),
                ),

                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('div', { className: "flex items-start sm:items-center justify-between gap-3 mb-3" },
                        h('h4', { className: "text-sm font-black text-gray-700 uppercase tracking-wide" }, "Select Station Grouped By Function"),
                        h('span', { className: "text-xs font-bold text-gray-500" }, `${safeTraversalIndex + 1}/${groupedTraversal.length}`)
                    ),
                    h('div', { className: "space-y-3" },
                        stationsByRole.map((roleEntry) =>
                            h('div', { key: roleEntry.roleKey },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400 mb-1.5" }, roleEntry.roleLabel),
                                h('div', { className: "flex flex-wrap gap-2" },
                                    roleEntry.stations.map((stationGroup) => {
                                        const traversalIndex = traversalIndexByRoleAndCode.get(`${roleEntry.roleKey}::${stationGroup.code}`);
                                        return h('button', {
                                            key: `${roleEntry.roleKey}-${stationGroup.code}`,
                                            type: 'button',
                                            onClick: () => setSelectedTraversalIndex(traversalIndex),
                                            className: `px-3 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition ${traversalIndex === safeTraversalIndex ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                        }, stationGroup.code);
                                    })
                                )
                            )
                        )
                    )
                ),

                h('div', { className: "bg-white p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] shadow-sm" },
                    h('div', { className: "flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between" },
                        h('div', { className: "flex items-center gap-2" },
                            h('button', {
                                type: 'button',
                                onClick: showPreviousStation,
                                disabled: safeTraversalIndex === 0,
                                className: `h-10 w-10 rounded-full text-lg font-black transition ${safeTraversalIndex === 0 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                                title: 'Previous station',
                                'aria-label': 'Previous station'
                            }, '←'),
                            h('button', {
                                type: 'button',
                                onClick: showNextStation,
                                disabled: safeTraversalIndex >= groupedTraversal.length - 1,
                                className: `h-10 w-10 rounded-full text-lg font-black transition ${safeTraversalIndex >= groupedTraversal.length - 1 ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`,
                                title: 'Next station',
                                'aria-label': 'Next station'
                            }, '→')
                        ),
                        h('div', { className: "sm:text-right" },
                            h('p', { className: "text-[10px] uppercase font-bold tracking-wider text-gray-400" }, "Station"),
                            h('h4', { className: "text-lg sm:text-2xl font-black text-gray-800" }, activeStation.code),
                            activeStation.name && h('p', { className: "text-sm sm:text-base text-gray-500 font-medium" }, activeStation.name),
                            activeStationRoles.length > 0 && h('p', { className: "text-[11px] text-gray-400 font-bold uppercase tracking-wide mt-1" }, activeStationRoles.join(' / '))
                        )
                    ),

                    h('div', { className: "mt-4" },
                        h('span', { className: "text-xs uppercase font-bold tracking-wider text-gray-400" }, "Level"),
                        h('div', { className: "mt-2 overflow-x-auto -mx-1 px-1 sm:mx-0 sm:px-0" },
                            h('div', { className: "flex items-center gap-2 min-w-max" },
                                [
                                    { value: 'all', label: `All (${sortedStationNotams.length})` },
                                    { value: 'high', label: `High (${notamsByLevel.high.length})` },
                                    { value: 'medium', label: `Medium (${notamsByLevel.medium.length})` },
                                    { value: 'low', label: `Low (${notamsByLevel.low.length})` }
                                ].map((filterOption) =>
                                    h('button', {
                                        key: filterOption.value,
                                        type: 'button',
                                        onClick: () => setPriorityFilter(filterOption.value),
                                        className: `px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition ${priorityFilter === filterOption.value ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`
                                    }, filterOption.label)
                                )
                            )
                        )
                    )
                ),

                h('div', {
                    className: "bg-white p-4 sm:p-8 rounded-2xl sm:rounded-[2rem] shadow-sm space-y-3 sm:space-y-4"
                },
                    visibleNotams.length === 0
                        ? h('div', { className: "text-center py-8 text-gray-500" },
                            h('p', { className: "font-bold" }, "No NOTAMs match the selected level filter for this station.")
                        )
                        : h('div', { className: "space-y-3" },
                            visibleNotams.map((notamEntry) =>
                                h('div', {
                                    key: `${activeStation.code}-${notamEntry._index}`,
                                    className: "rounded-2xl border border-gray-200 bg-gray-50/80 p-3 sm:p-4"
                                },
                                    h('div', { className: "flex flex-wrap items-center gap-2 mb-2" },
                                        h('span', { className: "text-xs font-black text-gray-800 bg-white border border-gray-200 rounded-lg px-2 py-1" }, notamEntry.key || 'No Key'),
                                        notamEntry.category && h('span', { className: "text-[10px] uppercase font-bold tracking-wide text-gray-500 bg-white border border-gray-200 rounded-lg px-2 py-1" }, notamEntry.category),
                                        notamEntry.priority && h('span', { className: "text-[10px] uppercase font-bold tracking-wide text-gray-500 bg-white border border-gray-200 rounded-lg px-2 py-1" }, String(notamEntry.priority))
                                    ),
                                    h('p', { className: "text-xs sm:text-sm text-gray-500 font-medium mb-2" },
                                        `${formatUtcDateTime(notamEntry.startDate)} - ${formatUtcDateTime(notamEntry.endDate)}`
                                    ),
                                    h('p', { className: "text-sm sm:text-base text-gray-700 leading-relaxed whitespace-pre-wrap break-words" },
                                        renderHighlightedNotamText(notamEntry.text, keywordPalette)
                                    )
                                )
                            )
                        )
                )
            );
        };

        // ==========================================
        // COLUMN CONFIGURATION
        // ==========================================

        /**
         * Static column definitions for additional flight data display.
         * Each column specifies a data path, human-readable label, and default visibility.
         * These can be toggled on/off in the settings panel.
         */
        const STATIC_COLUMNS = [
            { path: 'averages.altitude', label: 'Altitude (Avg)', defaultVisible: false },
            { path: 'averages.groundSpeed', label: 'Ground Speed (Avg)', defaultVisible: false },
            { path: 'averages.isaDeviation', label: 'ISA Deviation', defaultVisible: false },
            { path: 'indicatedAirSpeed.value', label: 'Indicated Air Speed', defaultVisible: false },
            { path: 'tracks.outbound.magnetic', label: 'Track Outbound (Magnetic)', defaultVisible: false },
            { path: 'tracks.outbound.true', label: 'Track Outbound (True)', defaultVisible: false },
            { path: 'tracks.segment.magnetic', label: 'Track Segment (Magnetic)', defaultVisible: false },
            { path: 'tracks.segment.true', label: 'Track Segment (True)', defaultVisible: false },
            { path: 'tropopause.value', label: 'Tropopause', defaultVisible: false },
            { path: 'temperature.value', label: 'Temperature', defaultVisible: false },
            { path: 'windComponent.value', label: 'Wind Component', defaultVisible: false },
            { path: 'windShear.value', label: 'Wind Shear', defaultVisible: false },
            { path: 'coordinates', label: 'Coordinates', defaultVisible: false },
            { path: 'averages.machSpeed', label: 'Mach Speed (Avg)', defaultVisible: false },
            { path: 'averages.minimumSafeAltitude.value', label: 'Min Safe Altitude', defaultVisible: false },
            { path: 'groundDistance.value', label: 'Ground Distance', defaultVisible: false },
            { path: 'averages.trueAirSpeed', label: 'True Air Speed (Avg)', defaultVisible: false }
        ];

        /**
         * Gets the human-readable label for a column path.
         * Falls back to a formatted version of the path if no label is found.
         * @param {string} path - The column data path
         * @returns {string} Human-readable column label
         */
        const getColumnLabel = (path) => {
            const columnDefinition = STATIC_COLUMNS.find(col => col.path === path);
            return columnDefinition ? columnDefinition.label : path.split('.').pop();
        };

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================

        /**
         * Main App Component - Root component managing the flight log application state.
         * Handles file uploads, route data management, and UI state for settings panel.
         */
        const App = () => {
            // Application state
            const [routeData, setRouteData] = useState(null);
            const [flightSummaryData, setFlightSummaryData] = useState(null);
            const [crewMembersData, setCrewMembersData] = useState(null);
            const [errorMessage, setErrorMessage] = useState(null);
            const [theme, setTheme] = useState(getInitialTheme);
            const [showSettings, setShowSettings] = useState(false);
            const [selectedColumns, setSelectedColumns] = useState([]);
            const [selectedPage, setSelectedPage] = useState('summary');
            const [documents, setDocuments] = useState([]);
            const [selectedDocumentIndex, setSelectedDocumentIndex] = useState(0);
            const [notams, setNotams] = useState([]);
            const [notamKeywords, setNotamKeywords] = useState([]);

            const isDarkMode = theme === 'dark';

            useEffect(() => {
                document.documentElement.dataset.theme = theme;
                document.body.dataset.theme = theme;

                try {
                    localStorage.setItem(THEME_STORAGE_KEY, theme);
                } catch (_) {}
            }, [theme]);

            useEffect(() => {
                return () => {
                    documents.forEach((documentItem) => {
                        if (documentItem?.url) {
                            URL.revokeObjectURL(documentItem.url);
                        }
                    });
                };
            }, [documents]);

            /**
             * Handles file upload and processing.
             * Reads the uploaded file, processes the flight data, and updates application state.
             * @param {Event} event - File input change event
             */
            const handleFileUpload = async (event) => {
                const selectedFile = event.target.files[0];
                if (!selectedFile) return;

                try {
                    const {
                        routesBackupText,
                        flightBackupText,
                        crewMembersBackupText,
                        notamsBackupText,
                        notamKeywordsBackupText,
                        documentFiles
                    } = await readBackupFilesFromArchive(selectedFile);
                    const processedRoute = processFlightData(routesBackupText);
                    const processedSummary = processFlightSummaryData(flightBackupText);
                    const processedCrew = crewMembersBackupText ? JSON.parse(crewMembersBackupText) : null;
                    const processedNotams = processNotamData(notamsBackupText);
                    const processedNotamKeywords = processNotamKeywordsData(notamKeywordsBackupText);
                    const mappedDocuments = documentFiles.map((documentItem) => ({
                        name: documentItem.name,
                        extension: documentItem.extension,
                        textContent: documentItem.textContent,
                        url: URL.createObjectURL(documentItem.blob)
                    }));

                    setRouteData(processedRoute);
                    setFlightSummaryData(processedSummary);
                    setCrewMembersData(Array.isArray(processedCrew) ? processedCrew : null);
                    const paperFlightPlanIndex = mappedDocuments.findIndex((doc) =>
                        doc.name.toLowerCase().includes('paperflightplan')
                    );
                    setDocuments(mappedDocuments);
                    setSelectedDocumentIndex(paperFlightPlanIndex !== -1 ? paperFlightPlanIndex : 0);
                    setNotams(processedNotams);
                    setNotamKeywords(processedNotamKeywords);
                    setSelectedPage('summary');
                    setErrorMessage(null);
                } catch (processingError) {
                    setErrorMessage("Error loading file: " + processingError.message);
                }

                // Reset file input
                event.target.value = '';
            };

            /**
             * Toggles visibility of a column in the waypoint display.
             * @param {string} columnPath - The path of the column to toggle
             */
            const toggleColumnVisibility = (columnPath) => {
                setSelectedColumns(prevSelected =>
                    prevSelected.includes(columnPath)
                        ? prevSelected.filter(path => path !== columnPath)
                        : [...prevSelected, columnPath]
                );
            };

            // Show welcome screen if no route data is loaded
            if (!routeData) {
                return h(WelcomeScreen, {
                    onFileSelected: handleFileUpload,
                    error: errorMessage
                });
            }

            // Main application interface
            return h('div', { className: "max-w-6xl mx-auto p-3 sm:p-6 animate-in" },

                // Subpage menu (Overview / OFP) + Settings button
                h('div', { className: "flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6" },
                    h('div', { className: "flex-1 overflow-x-auto -mx-1 px-1 sm:mx-0 sm:px-0" },
                        h('div', { className: "flex items-center gap-2 min-w-max" },
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'summary' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('summary');
                                    setShowSettings(false);
                                }
                            }, 'Overview'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'OFP' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => setSelectedPage('OFP')
                            }, 'OFP'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'weight' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('weight');
                                    setShowSettings(false);
                                }
                            }, 'Weight'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'fuel' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('fuel');
                                    setShowSettings(false);
                                }
                            }, 'Fuel'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'fuelImpact' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('fuelImpact');
                                    setShowSettings(false);
                                }
                            }, 'Fuel Impact'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'stations' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('stations');
                                    setShowSettings(false);
                                }
                            }, 'Stations'),
                            h('button', {
                                className: `px-4 py-2 rounded-2xl text-sm sm:text-base font-bold whitespace-nowrap transition ${selectedPage === 'documents' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`,
                                onClick: () => {
                                    setSelectedPage('documents');
                                    setShowSettings(false);
                                }
                            }, 'Documents')
                        )
                    ),
                    h('div', { className: "relative shrink-0" },
                        h('button', {
                            onClick: () => setShowSettings(!showSettings),
                            className: "flex items-center justify-center text-gray-400 hover:text-gray-600 bg-gray-100 hover:bg-gray-200 py-2 px-2 aspect-square rounded-2xl transition-colors shadow-sm",
                            'aria-label': 'Toggle settings menu',
                            title: 'Settings'
                        }, h(Icon, { name: "settings", className: "w-4 h-4" })),
                        showSettings && h('div', {
                            className: "absolute top-11 right-0 z-20 bg-white border border-gray-200 rounded-2xl shadow-xl p-4 w-[min(92vw,440px)] animate-in"
                        },
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Appearance"),
                            h('label', {
                                className: "flex items-center justify-between gap-3 rounded-2xl bg-gray-50 px-3 py-3 cursor-pointer group"
                            },
                                h('div', { className: "min-w-0" },
                                    h('p', { className: "text-sm font-bold text-gray-700 group-hover:text-gray-800" }, "Dark mode"),
                                    h('p', { className: "text-xs text-gray-400 mt-0.5" }, "Switch to a night-friendly interface.")
                                ),
                                h('span', {
                                    className: `relative inline-flex h-7 w-12 items-center rounded-full transition-colors ${isDarkMode ? 'bg-blue-600' : 'bg-gray-200'}`
                                },
                                    h('span', {
                                        className: `inline-block h-5 w-5 rounded-full bg-white shadow-sm transition-transform ${isDarkMode ? 'translate-x-6' : 'translate-x-1'}`
                                    })
                                ),
                                h('input', {
                                    type: 'checkbox',
                                    className: "sr-only",
                                    checked: isDarkMode,
                                    onChange: () => setTheme((previousTheme) => previousTheme === 'dark' ? 'light' : 'dark')
                                })
                            ),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            // Overview section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Overview"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "No settings"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Documents"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "No settings"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-2" }, "Stations"),
                            h('p', { className: "text-xs text-gray-400 mb-3" }, "No settings"),

                            h('div', { className: "border-t border-gray-100 my-3" }),

                            // OFP section
                            h('p', { className: "text-xs uppercase font-bold tracking-wider text-gray-400 mb-3" }, "OFP Columns"),
                            h('div', { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3" },
                                STATIC_COLUMNS
                                    .slice()
                                    .sort((a, b) => a.label.localeCompare(b.label))
                                    .map(column => h('label', {
                                        key: column.path,
                                        className: "flex items-center gap-2.5 cursor-pointer group"
                                    },
                                        h('input', {
                                            type: 'checkbox',
                                            className: "w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500",
                                            checked: selectedColumns.includes(column.path),
                                            onChange: () => toggleColumnVisibility(column.path)
                                        }),
                                        h('span', { className: "text-sm font-bold text-gray-500 group-hover:text-gray-800" }, column.label)
                                    ))
                            ),

                            h('div', { className: "border-t border-gray-100 mt-1 mb-3" }),

                            // Close settings action
                            h('button', {
                                onClick: () => setShowSettings(false),
                                className: "w-full text-left text-sm font-bold text-gray-600 hover:text-gray-800 hover:bg-gray-50 px-3 py-2 rounded-lg transition-colors mb-1"
                            }, "Close"),

                            // Close flight action
                            h('button', {
                                onClick: () => {
                                    setShowSettings(false);
                                    setRouteData(null);
                                    setFlightSummaryData(null);
                                    setCrewMembersData(null);
                                    setDocuments([]);
                                    setSelectedDocumentIndex(0);
                                    setNotams([]);
                                    setNotamKeywords([]);
                                },
                                className: "w-full text-left text-sm font-bold text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-lg transition-colors"
                            }, "Close Flight")
                        )
                    )
                ),

                // Route header is shown only on Overview page
                selectedPage === 'summary' && h(RouteHeader, {
                    atcCallsign: flightSummaryData?.atcCallsign || null,
                    flightNumber: flightSummaryData?.flightNumber || null,
                    originIcao: flightSummaryData?.originAirport?.icaoCode || null,
                    destinationIcao: flightSummaryData?.destinationAirport?.icaoCode || null,
                    ofpVersion: flightSummaryData?.ofpVersion || null,
                    scheduledTimes: flightSummaryData?.scheduledTimes || null
                }),

                // Page content (Summary, OFP, Weight, Fuel, Fuel Impact, Stations, or Documents)
                selectedPage === 'OFP'
                    ? h('div', { className: "space-y-4" },
                        h(OffBlockSection, {
                            summary: flightSummaryData
                        }),
                        h('div', { className: "rounded-[2rem] border border-sky-60 bg-gradient-to-br from-sky-30 via-cyan-30 to-white p-3 sm:p-5 shadow-sm space-y-3" },
                            h('div', { className: "px-1" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-[0.22em] text-sky-500 mb-1" }, 'DEPARTURE')
                            ),
                            h('div', { className: "space-y-4" },
                                (routeData.waypoints || []).map((waypoint, index) =>
                                    h(WaypointCard, {
                                        key: waypoint.UUID || index,
                                        waypoint: waypoint,
                                        index: index,
                                        selectedColumns: selectedColumns
                                    })
                                )
                            ),
                            h('div', { className: "px-1 pt-1" },
                                h('p', { className: "text-[10px] uppercase font-bold tracking-[0.22em] text-sky-500 mb-1" }, 'LANDING')
                            )
                        ),
                        h(OnBlockEndSection, {
                            summary: flightSummaryData,
                            route: routeData
                        })
                    )
                    : selectedPage === 'weight'
                        ? h(WeightPage, { summary: flightSummaryData })
                    : selectedPage === 'fuel'
                        ? h(FuelPage, { summary: flightSummaryData })
                    : selectedPage === 'fuelImpact'
                        ? h(FuelImpactPage, { summary: flightSummaryData })
                    : selectedPage === 'stations'
                        ? h(StationsPage, {
                            notams,
                            keywordPalette: notamKeywords
                        })
                    : selectedPage === 'documents'
                        ? h(DocumentsPage, {
                            documents,
                            selectedDocumentIndex,
                            onSelectDocument: setSelectedDocumentIndex
                        })
                        : h(FlightSummaryPage, { summary: flightSummaryData, crewMembers: crewMembersData })
            );
        };

        // ==========================================
        // APPLICATION INITIALIZATION
        // ==========================================

        // Create React root and render the main App component
        // This initializes the FlyFly Web Demo application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>

</html>
